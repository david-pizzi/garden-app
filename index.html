<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Violetta's Growing Journal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Georgia, serif;
      background: #f5f0eb;
      color: #2d3a2d;
      min-height: 100vh;
    }

    #app {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 16px 80px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 4px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: normal;
      color: #2d4a2d;
      line-height: 1.2;
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .header-icon { font-size: 28px; }

    .manage-btn {
      font-size: 11px;
      color: #8a9a8a;
      background: none;
      border: none;
      cursor: pointer;
      font-family: sans-serif;
      padding: 0;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .manage-btn.active { color: #2d4a2d; }

    .date-line {
      font-size: 13px;
      color: #8a9a8a;
      font-family: sans-serif;
      margin-bottom: 20px;
    }

    /* ── Summary strip ── */
    .summary-strip {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .summary-chip {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      background: #fff;
      border-radius: 20px;
      font-size: 13px;
      font-family: sans-serif;
      border: 1px solid #ede8e0;
    }

    /* ── Schedule Overview ── */
    .schedule-overview {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ov-section {
      background: #fff;
      border-radius: 10px;
      border: 1px solid #ede8e0;
      border-left: 3px solid #ccc;
      overflow: hidden;
    }

    .ov-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 12px;
      background: #fafaf8;
      border-bottom: 1px solid #f4f0ea;
    }

    .ov-section-label {
      font-family: sans-serif;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #8a9a8a;
    }

    .ov-badge {
      font-family: sans-serif;
      font-size: 11px;
      font-weight: 700;
      background: #f0ece6;
      color: #7a8a7a;
      padding: 1px 7px;
      border-radius: 10px;
    }

    .page-section-label {
      font-family: sans-serif;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #b0beb0;
      margin-bottom: 10px;
    }

    .ov-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid #f9f6f2;
      cursor: pointer;
      font-family: sans-serif;
    }

    .ov-item:last-child { border-bottom: none; }
    .ov-item:active { background: #f4f0ea; }

    .ov-loc { font-size: 15px; flex-shrink: 0; }
    .ov-name { flex: 1; color: #2d4a2d; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ov-action { color: #6a7a6a; font-size: 12px; white-space: nowrap; flex-shrink: 0; }
    .ov-date { color: #aabcaa; font-size: 11px; white-space: nowrap; flex-shrink: 0; margin-left: 4px; }

    /* ── Storage panel ── */
    .storage-panel {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #b5d0b5;
      margin-bottom: 20px;
    }

    .snap-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid #f4f0ea;
    }

    .snap-row:last-child { border-bottom: none; }

    .snap-name {
      flex: 1;
      font-size: 14px;
      color: #2d4a2d;
    }

    .btn-sm {
      padding: 5px 10px;
      background: #f0ece6;
      color: #555;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-family: sans-serif;
    }

    .btn-danger {
      padding: 5px 10px;
      background: #fff0f0;
      color: #cc4a20;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-family: sans-serif;
    }

    .io-row {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .io-btn {
      flex: 1;
      padding: 9px;
      background: #f0f7f0;
      color: #2d4a2d;
      border: 1px solid #b5d0b5;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      font-family: sans-serif;
      text-align: center;
    }

    /* ── Plant cards ── */
    .plant-card {
      background: #fff;
      border-radius: 12px;
      margin-bottom: 12px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      border: 1px solid #ede8e0;
      cursor: pointer;
    }

    .plant-card-main {
      display: flex;
      align-items: center;
      padding: 14px;
      gap: 12px;
    }

    .location-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .plant-name {
      font-size: 15px;
      color: #2d4a2d;
      margin-bottom: 4px;
    }

    .plant-meta { display: flex; gap: 6px; flex-wrap: wrap; }

    .tag {
      font-size: 11px;
      font-family: sans-serif;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .tag-loc  { background: #f0f7f0; color: #3a6a3a; }
    .tag-day  { background: #f0f4ff; color: #4a5aaa; }
    .tag-due  { background: #fff3f0; color: #cc4a20; font-weight: 600; }

    .chevron { color: #c0d0c0; margin-left: auto; font-size: 20px; line-height: 1; }

    /* ── Quick actions ── */
    .quick-actions {
      display: flex;
      border-top: 1px solid #f0ece6;
    }

    .quick-btn {
      flex: 1;
      padding: 8px 2px;
      background: none;
      border: none;
      border-right: 1px solid #f0ece6;
      font-size: 10px;
      cursor: pointer;
      font-family: sans-serif;
      color: #5a7a5a;
    }

    .quick-btn:last-child { border-right: none; }
    .quick-btn.done { color: #059669; font-weight: 600; }

    /* ── Add plant ── */
    .add-plant-btn {
      width: 100%;
      padding: 14px;
      background: none;
      border: 2px dashed #b5c9b5;
      border-radius: 12px;
      color: #5a8a5a;
      font-size: 14px;
      cursor: pointer;
      font-family: Georgia, serif;
    }

    .add-plant-form {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #ede8e0;
    }

    .input-text {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d0ddd0;
      border-radius: 8px;
      font-size: 14px;
      font-family: Georgia, serif;
      margin-bottom: 10px;
    }

    .btn-row { display: flex; gap: 8px; }

    .btn-primary {
      flex: 1;
      padding: 10px;
      background: #2d4a2d;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      font-family: Georgia, serif;
    }

    .btn-secondary {
      padding: 10px 16px;
      background: #f0ece6;
      color: #555;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }

    /* ── Detail view ── */
    .back-btn {
      background: none;
      border: none;
      color: #a8c5a0;
      font-size: 14px;
      cursor: pointer;
      padding: 0;
      margin-bottom: 12px;
      font-family: Georgia, serif;
      display: block;
    }

    .detail-title {
      font-size: 22px;
      color: #2d4a2d;
      margin-bottom: 8px;
    }

    .detail-meta {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .section-card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #ede8e0;
      margin-bottom: 12px;
    }

    .section-label {
      font-size: 11px;
      color: #8a9a8a;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 12px;
      font-family: sans-serif;
    }

    .date-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #f4f0ea;
    }

    .date-row:last-child { border-bottom: none; }

    .date-label {
      font-size: 13px;
      color: #555;
      font-family: sans-serif;
    }

    .date-value {
      font-size: 12px;
      color: #555;
      font-family: sans-serif;
      margin-right: 8px;
    }

    .date-input {
      padding: 4px 8px;
      border: 1px solid #b5d0b5;
      border-radius: 6px;
      font-size: 12px;
      background: #f0f7f0;
      color: #2d4a2d;
      font-family: sans-serif;
      cursor: pointer;
    }

    .location-select {
      padding: 4px 8px;
      border: 1px solid #b5d0b5;
      border-radius: 6px;
      font-size: 12px;
      background: #f0f7f0;
      color: #3a6a3a;
      font-family: sans-serif;
    }

    .note-textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #d5e5d5;
      border-radius: 8px;
      font-size: 14px;
      font-family: Georgia, serif;
      resize: none;
      margin-bottom: 8px;
    }

    .save-note-btn {
      width: 100%;
      padding: 10px;
      background: #2d4a2d;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      font-family: Georgia, serif;
    }

    /* ── Event log ── */
    .event-row {
      display: flex;
      gap: 10px;
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid #f4f0ea;
    }

    .event-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

    .event-date {
      font-size: 11px;
      color: #8a9a8a;
      font-family: sans-serif;
      white-space: nowrap;
      padding-top: 2px;
      min-width: 72px;
    }

    .event-type {
      font-size: 12px;
      background: #f0f7f0;
      color: #3a6a3a;
      border-radius: 4px;
      padding: 2px 6px;
      font-family: sans-serif;
      margin-right: 6px;
    }

    .event-detail { font-size: 13px; color: #444; }

    /* ── Card dates row ── */
    .plant-dates {
      font-size: 11px;
      color: #7a8a7a;
      font-family: sans-serif;
      margin-top: 5px;
    }

    .plant-dates span { margin-right: 8px; }

    /* ── Delete plant button ── */
    .delete-plant-btn {
      background: none;
      border: none;
      color: #ccc;
      font-size: 16px;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
      flex-shrink: 0;
    }

    .delete-plant-btn:hover { color: #cc4a20; }
  </style>
</head>

    ];

    const LOCATIONS = ["indoor (grow light)", "greenhouse", "raised bed", "hardening off"];

    const LOCATION_COLORS = {
      "indoor (grow light)": "#7c3aed",
      "greenhouse":          "#059669",
      "raised bed":          "#b45309",
      "hardening off":       "#0369a1",
    };

    const LOCATION_ICONS = {
      "indoor (grow light)": "💡",
      "greenhouse":          "🌿",
      "raised bed":          "🌱",
      "hardening off":       "🌤️",
    };

    const STORAGE_KEY    = "violetta-garden-tracker-v1";
    const SNAPSHOT_PREFIX = "violetta-snap-";

    // ── State ──────────────────────────────────────────────────────────────
    const state = {
      plants:          loadPlants(),
      view:            "home",
      selectedPlantId: null,
      addingPlant:     false,
      currentNote:     "",
      storageOpen:     false,
      snapshotName:    "",
      importText:      "",
    };

    function loadPlants() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        return saved ? JSON.parse(saved) : INITIAL_PLANTS;
      } catch { return INITIAL_PLANTS; }
    }

    function savePlants() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.plants)); } catch {}
    }

    // ── Helpers ────────────────────────────────────────────────────────────
    function daysSince(dateStr) {
      if (!dateStr) return null;
      return Math.floor((Date.now() - new Date(dateStr).getTime()) / 86400000);
    }

    function formatDate(dateStr) {
      if (!dateStr) return "—";
      return new Date(dateStr).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
    }

    function todayStr() {
      return new Date().toISOString().split("T")[0];
    }

    function feedStatus(plant) {
      if (!plant.feedEvery || !plant.lastFed) return null;
      const daysUntil = plant.feedEvery - daysSince(plant.lastFed);
      const next = new Date(plant.lastFed);
      next.setDate(next.getDate() + plant.feedEvery);
      return { daysUntil, nextDate: next.toISOString().split("T")[0] };
    }

    function estimatedGerminationDate(plant) {
      if (!plant.sowDate || !plant.germinationDays) return null;
      const d = new Date(plant.sowDate);
      d.setDate(d.getDate() + plant.germinationDays);
      return d.toISOString().split("T")[0];
    }

    function estimatedHarvestDate(plant) {
      if (!plant.sowDate || !plant.harvestDays) return null;
      const d = new Date(plant.sowDate);
      d.setDate(d.getDate() + plant.harvestDays);
      return d.toISOString().split("T")[0];
    }

    function shortAgo(dateStr) {
      if (!dateStr) return null;
      const d = daysSince(dateStr);
      if (d === 0) return "today";
      if (d === 1) return "yesterday";
      return `${d}d ago`;
    }

    function esc(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // ── Data mutations ─────────────────────────────────────────────────────
    function updatePlant(id, updates) {
      state.plants = state.plants.map(p => p.id === id ? { ...p, ...updates } : p);
      savePlants();
    }

    function deletePlant(id) {
      if (!confirm(`Delete this plant? This cannot be undone.`)) return;
      state.plants = state.plants.filter(p => p.id !== id);
      savePlants();
      render();
    }

    function logEvent(plantId, type, detail = "") {
      const ev = { date: todayStr(), type, detail };
      state.plants = state.plants.map(p =>
        p.id === plantId
          ? { ...p, events: [ev, ...(p.events || [])].slice(0, 30) }
          : p
      );
      savePlants();
    }

    // ── Storage management ─────────────────────────────────────────────────
    function listSnapshots() {
      const names = [];
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith(SNAPSHOT_PREFIX)) {
          names.push(key.slice(SNAPSHOT_PREFIX.length));
        }
      }
      return names.sort();
    }

    function saveSnapshot(name) {
      if (!name.trim()) return;
      localStorage.setItem(SNAPSHOT_PREFIX + name.trim(), JSON.stringify(state.plants));
    }

    function loadSnapshot(name) {
      try {
        const data = localStorage.getItem(SNAPSHOT_PREFIX + name);
        if (!data) return;
        state.plants = JSON.parse(data);
        savePlants();
        state.storageOpen = false;
        render();
      } catch { alert("Could not load snapshot."); }
    }

    function deleteSnapshot(name) {
      if (!confirm(`Delete snapshot "${name}"?`)) return;
      localStorage.removeItem(SNAPSHOT_PREFIX + name);
      render();
    }

    function importFromText(text) {
      try {
        const data = JSON.parse(text);
        if (!Array.isArray(data)) throw new Error();
        if (!confirm(`Import ${data.length} plants? This will replace your current data.`)) return;
        state.plants = data;
        savePlants();
        state.storageOpen = false;
        state.importText = "";
        render();
      } catch { alert("Invalid JSON — paste a valid garden data export."); }
    }

    // ── Render ─────────────────────────────────────────────────────────────
    function render() {
      document.getElementById("app").innerHTML =
        state.view === "detail" ? renderDetail() : renderHome();
      attachEvents();
    }

    function renderStoragePanel() {
      const snaps = listSnapshots();

      const snapRows = snaps.length > 0 ? `
        <div class="section-label" style="margin-top:14px;">Saved snapshots</div>
        ${snaps.map(name => `
          <div class="snap-row">
            <span class="snap-name">${esc(name)}</span>
            <button class="btn-sm" data-load-snap="${esc(name)}">Load</button>
            <button class="btn-danger" data-del-snap="${esc(name)}">Delete</button>
          </div>`).join("")}` : "";

      return `
        <div class="storage-panel">
          <div class="section-label">Save a snapshot</div>
          <div style="display:flex;gap:8px;">
            <input id="snap-name" class="input-text" type="text" placeholder="e.g. Week 3, Before repot…"
              value="${esc(state.snapshotName)}" style="margin-bottom:0;flex:1;">
            <button class="btn-primary" id="do-save-snap" style="flex:none;padding:10px 14px;font-size:13px;">Save</button>
          </div>
          ${snapRows}
          <div class="section-label" style="margin-top:14px;">Export</div>
          <textarea class="note-textarea" rows="4" readonly
            onclick="this.select()"
            style="font-family:monospace;font-size:11px;color:#444;cursor:pointer;"
            title="Click to select all, then copy"
          >${esc(JSON.stringify(state.plants, null, 2))}</textarea>

          <div class="section-label" style="margin-top:6px;">Import — paste JSON below</div>
          <textarea class="note-textarea" id="import-text" rows="4"
            placeholder="Paste exported JSON here…"
            style="font-family:monospace;font-size:11px;"
          >${esc(state.importText)}</textarea>
          <button class="save-note-btn" id="do-import">Load from text</button>

          <div class="section-label" style="margin-top:14px;">Danger zone</div>
          <button class="btn-secondary" id="load-sample" style="width:100%;padding:10px;margin-bottom:8px;">Load sample data</button>
          <button class="btn-danger" id="do-reset" style="width:100%;padding:10px;">Reset to default — clear all data</button>
        </div>`;
    }

    function renderScheduleOverview() {
      const today = todayStr();
      const todayMs = new Date(today).setHours(0, 0, 0, 0);
      const msDay = 86400000;

      const allEvents = [];
      for (const plant of state.plants) {
        const fs = feedStatus(plant);
        if (fs) {
          allEvents.push({ plant, type: "feed", daysUntil: fs.daysUntil, date: fs.nextDate });
        }
        if (!plant.germinationDate) {
          const est = estimatedGerminationDate(plant);
          if (est) {
            const daysUntil = Math.round((new Date(est).setHours(0, 0, 0, 0) - todayMs) / msDay);
            allEvents.push({ plant, type: "germ", daysUntil, date: est });
          }
        }
        if (!plant.harvestDate) {
          const est = estimatedHarvestDate(plant);
          if (est) {
            const daysUntil = Math.round((new Date(est).setHours(0, 0, 0, 0) - todayMs) / msDay);
            allEvents.push({ plant, type: "harvest", daysUntil, date: est });
          }
        }
      }

      const overdue       = allEvents.filter(e => e.daysUntil < 0).sort((a, b) => a.daysUntil - b.daysUntil);
      const todayItems    = allEvents.filter(e => e.daysUntil === 0);
      const tomorrowItems = allEvents.filter(e => e.daysUntil === 1);
      const weekItems     = allEvents.filter(e => e.daysUntil >= 2 && e.daysUntil <= 7).sort((a, b) => a.daysUntil - b.daysUntil);

      if (!overdue.length && !todayItems.length && !tomorrowItems.length && !weekItems.length)
        return `<div style="font-family:sans-serif;font-size:13px;color:#b0beb0;padding:12px 2px 20px;text-align:center;">All clear — nothing overdue or due this week 🌱</div>`;

      const renderItem = e => {
        const locIcon = LOCATION_ICONS[e.plant.location] || "🌱";
        let action;
        if (e.type === "feed") {
          action = e.daysUntil < 0  ? `💧 Feed ${Math.abs(e.daysUntil)}d overdue`
                 : e.daysUntil === 0 ? `💧 Feed today`
                 : e.daysUntil === 1 ? `💧 Feed tomorrow`
                 : `💧 Feed in ${e.daysUntil}d`;
        } else if (e.type === "germ") {
          action = e.daysUntil < 0  ? `🌿 Germination ${Math.abs(e.daysUntil)}d overdue`
                 : e.daysUntil === 0 ? `🌿 Germination today`
                 : e.daysUntil === 1 ? `🌿 Germination tomorrow`
                 : `🌿 Germinates in ${e.daysUntil}d`;
        } else {
          action = e.daysUntil < 0  ? `🌾 Harvest ${Math.abs(e.daysUntil)}d overdue`
                 : e.daysUntil === 0 ? `🌾 Harvest today`
                 : e.daysUntil === 1 ? `🌾 Harvest tomorrow`
                 : `🌾 Harvest in ${e.daysUntil}d`;
        }
        const dateChip = e.daysUntil >= 2 ? `<span class="ov-date">${formatDate(e.date)}</span>` : "";
        return `<div class="ov-item" data-open="${e.plant.id}">
          <span class="ov-loc">${locIcon}</span>
          <span class="ov-name">${esc(e.plant.name)}</span>
          <span class="ov-action">${action}</span>
          ${dateChip}
        </div>`;
      };

      const section = (label, items, borderColor) => {
        if (!items.length) return "";
        return `<div class="ov-section" style="border-left-color:${borderColor};">
          <div class="ov-section-header">
            <span class="ov-section-label">${label}</span>
            <span class="ov-badge">${items.length}</span>
          </div>
          ${items.map(renderItem).join("")}
        </div>`;
      };

      return `<div class="schedule-overview">
        ${section("Overdue", overdue, "#e8856a")}
        ${section("Today", todayItems, "#059669")}
        ${section("Tomorrow", tomorrowItems, "#3b82f6")}
        ${section("This week", weekItems, "#8ab58a")}
      </div>`;
    }

    function renderHome() {
      const today = new Date().toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });

      const chips = Object.entries(LOCATION_ICONS).map(([loc, icon]) => {
        const n = state.plants.filter(p => p.location === loc).length;
        return n > 0 ? `<div class="summary-chip">${icon} ${n}</div>` : "";
      }).join("");

      const sownCount       = state.plants.filter(p => p.sowDate).length;
      const germinatedCount = state.plants.filter(p => p.germinationDate).length;


      const cards = state.plants.map(plant => {
        const sowDays = daysSince(plant.sowDate);
        const fs      = feedStatus(plant);
        const overdue = fs && fs.daysUntil <= 0;
        const color   = LOCATION_COLORS[plant.location] || "#64748b";

        const estGermCard    = estimatedGerminationDate(plant);
        const estHarvestCard = estimatedHarvestDate(plant);
        const germOverdue    = !!(estGermCard && estGermCard < todayStr() && !plant.germinationDate);
        const germDaysOver = germOverdue ? Math.floor((Date.now() - new Date(estGermCard).getTime()) / 86400000) : 0;

        const overdueLabel = fs && fs.daysUntil < 0  ? `Feed ${Math.abs(fs.daysUntil)}d overdue`
                           : fs && fs.daysUntil === 0 ? "Feed today" : "";
        const germLabel    = germDaysOver === 0 ? "Germination today" : `Germination ${germDaysOver}d overdue`;

        const qtyLabel = plant.quantity && plant.germinatedQuantity && plant.germinatedQuantity !== plant.quantity
          ? `×${plant.germinatedQuantity}/${plant.quantity}`
          : plant.quantity ? `×${plant.quantity}` : null;

        const tags = [
          `<span class="tag tag-loc">${esc(plant.location)}</span>`,
          sowDays !== null ? `<span class="tag tag-day">day ${sowDays}</span>` : "",
          qtyLabel         ? `<span class="tag" style="background:#f5f0ff;color:#6b46c1;">${qtyLabel}</span>` : "",
          overdue          ? `<span class="tag tag-due">${overdueLabel}</span>` : "",
          germOverdue      ? `<span class="tag" style="background:#fff8e0;color:#b45309;font-weight:600;">${germLabel}</span>` : "",
        ].join("");

        const feedPart = fs
          ? (fs.daysUntil <= 0 ? null
            : fs.daysUntil === 1 ? `🗓 <strong>Feed tomorrow</strong>`
            : `🗓 Next feed in ${fs.daysUntil}d`)
          : (plant.feedEvery && !plant.lastFed ? `🗓 Not yet fed` : null);

        const dateParts = [
          plant.sowDate   ? `🌱 Sown ${formatDate(plant.sowDate)}`    : null,
          plant.lastFed   ? `💧 Fed ${shortAgo(plant.lastFed)}`       : null,
          plant.potOnDate ? `🪴 Potted ${formatDate(plant.potOnDate)}` : null,
          plant.germinationDate ? `🌿 Germinated ${formatDate(plant.germinationDate)}` :
          estGermCard           ? `🌿 Germinates ~${formatDate(estGermCard)}` : null,
          plant.harvestDate     ? `🌾 Harvested ${formatDate(plant.harvestDate)}` :
          estHarvestCard        ? `🌾 Harvest ~${formatDate(estHarvestCard)}` : null,
          feedPart,
        ].filter(Boolean);
        const datesRow = dateParts.length > 0
          ? `<div class="plant-dates">${dateParts.map(d => `<span>${d}</span>`).join("")}</div>`
          : "";

        const btns = [
          { label: plant.sowDate         ? "✓ Sown"        : "+ Sow",        type: "sow",     done: !!plant.sowDate },
          { label: plant.germinationDate ? "✓ Germinated"  : "🌿 Germinate", type: "germ",    done: !!plant.germinationDate },
          { label: plant.potOnDate       ? "✓ Potted"      : "+ Pot on",     type: "poton",   done: !!plant.potOnDate },
          { label: "💧 Fed",                                                   type: "fed",     done: false },
          { label: plant.harvestDate     ? "✓ Harvested"   : "🌾 Harvest",   type: "harvest", done: !!plant.harvestDate },
          { label: "📍 Move",                                                  type: "move",    done: false },
        ].map(b =>
          `<button class="quick-btn${b.done ? " done" : ""}" data-action="${b.type}" data-plant="${plant.id}">${b.label}</button>`
        ).join("");

        return `
          <div class="plant-card" data-open="${plant.id}" style="${
            overdue     ? "background:#fff5f3;border-color:#e8856a;border-width:2px;" :
            germOverdue ? "background:#fffbf0;border-color:#e8c85a;border-width:2px;" : ""
          }">
            <div class="plant-card-main">
              <div class="location-icon" style="background:${color}22;">${LOCATION_ICONS[plant.location] || "🌱"}</div>
              <div style="flex:1;min-width:0;">
                <div class="plant-name">${esc(plant.name)}</div>
                <div class="plant-meta">${tags}</div>
                ${datesRow}
              </div>
              <div style="display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;align-self:stretch;padding-left:8px;">
                <button class="delete-plant-btn" data-del-plant="${plant.id}" title="Delete plant">×</button>
                <div class="chevron">›</div>
              </div>
            </div>
            <div class="quick-actions">${btns}</div>
          </div>`;
      }).join("");

      const addSection = state.addingPlant ? `
        <div class="add-plant-form">
          <input id="new-plant-name" class="input-text" type="text" placeholder="Plant name (e.g. Borlotti Bean)" autofocus>
          <div class="btn-row">
            <button class="btn-primary" id="confirm-add">Add Plant</button>
            <button class="btn-secondary" id="cancel-add">Cancel</button>
          </div>
        </div>` : `
        <button class="add-plant-btn" id="start-add">+ Add another plant</button>`;

      return `
        <div class="header">
          <h1>Violetta's<br>Growing Journal</h1>
          <div class="header-right">
            <span class="header-icon">🌿</span>
            <button class="manage-btn${state.storageOpen ? " active" : ""}" id="toggle-storage">
              ${state.storageOpen ? "✕ close" : "💾 manage data"}
            </button>
          </div>
        </div>
        <div class="date-line">${today}</div>
        ${state.storageOpen ? renderStoragePanel() : ""}
        <div class="summary-strip">
          ${chips}
          ${sownCount > 0       ? `<div class="summary-chip">🌱 ${sownCount}</div>` : ""}
          ${germinatedCount > 0 ? `<div class="summary-chip">🪴 ${germinatedCount}</div>` : ""}
        </div>
        <div class="page-section-label">Overview</div>
        ${renderScheduleOverview()}
        <div class="page-section-label">Plants</div>
        ${cards}
        ${addSection}`;
    }

    function renderDetail() {
      const p = state.plants.find(pl => pl.id === state.selectedPlantId);
      if (!p) return "";

      const sowDays  = daysSince(p.sowDate);
      const color    = LOCATION_COLORS[p.location] || "#64748b";
      const estGerm    = estimatedGerminationDate(p);
      const estHarvest = estimatedHarvestDate(p);

      const locOptions = LOCATIONS.map(loc =>
        `<option value="${esc(loc)}"${p.location === loc ? " selected" : ""}>${LOCATION_ICONS[loc]} ${esc(loc)}</option>`
      ).join("");

      const numInput = (id, val, opts = {}) => `
        <input type="number" id="${id}" min="${opts.min ?? 1}" max="${opts.max ?? 9999}"
          value="${val || ""}" placeholder="—"
          style="width:${opts.width ?? "64px"};text-align:center;padding:4px 8px;border:1px solid #b5d0b5;border-radius:6px;font-size:12px;background:#f0f7f0;color:#2d4a2d;font-family:sans-serif;">`;

      const dateInput = (field, val) => `
        <input type="date" class="date-input" data-field="${field}" value="${val || ""}" max="${todayStr()}">`;

      const estGermDisplay = (() => {
        if (!estGerm) return `<span style="font-size:12px;font-family:sans-serif;color:#ccc;">set sow date &amp; period</span>`;
        const daysLeft = Math.ceil((new Date(estGerm) - new Date()) / 86400000);
        const col    = daysLeft < 0 ? "#8a9a8a" : daysLeft === 0 ? "#059669" : "#2d4a2d";
        const suffix = daysLeft < 0 ? ` (${Math.abs(daysLeft)}d ago)` : daysLeft === 0 ? " (today!)" : ` (in ${daysLeft}d)`;
        return `<span style="font-size:12px;font-family:sans-serif;font-weight:600;color:${col};">${formatDate(estGerm)}${suffix}</span>`;
      })();

      const estHarvestDisplay = (() => {
        if (!estHarvest) return `<span style="font-size:12px;font-family:sans-serif;color:#ccc;">set sow date &amp; days</span>`;
        const daysLeft = Math.ceil((new Date(estHarvest) - new Date()) / 86400000);
        const col    = daysLeft < 0 ? "#8a9a8a" : daysLeft === 0 ? "#b45309" : "#2d4a2d";
        const suffix = daysLeft < 0 ? ` (${Math.abs(daysLeft)}d ago)` : daysLeft === 0 ? " (today!)" : ` (in ${daysLeft}d)`;
        return `<span style="font-size:12px;font-family:sans-serif;font-weight:600;color:${col};">${formatDate(estHarvest)}${suffix}</span>`;
      })();

      const nextFeedDisplay = (() => {
        const fs = feedStatus(p);
        if (!fs) return "";
        const label = fs.daysUntil < 0  ? `${Math.abs(fs.daysUntil)}d overdue`
                    : fs.daysUntil === 0 ? "today"
                    : fs.daysUntil === 1 ? `tomorrow (${formatDate(fs.nextDate)})`
                    : `${formatDate(fs.nextDate)} — in ${fs.daysUntil}d`;
        const col = fs.daysUntil <= 0 ? "#cc4a20" : fs.daysUntil <= 2 ? "#b45309" : "#3a6a3a";
        return `<div class="date-row">
          <span class="date-label" style="color:#aaa;">Next feed</span>
          <span style="font-size:12px;font-family:sans-serif;font-weight:600;color:${col};">${label}</span>
        </div>`;
      })();

      const notes = p.events && p.events.filter(e => e.type === "note").length > 0 ? `
        <div class="section-card">
          <div class="section-label">Notes</div>
          ${p.events.filter(e => e.type === "note").map(ev => `
            <div class="event-row">
              <div class="event-date">${formatDate(ev.date)}</div>
              <div class="event-detail">${esc(ev.detail)}</div>
            </div>`).join("")}
        </div>` : "";

      return `
        <button class="back-btn" id="back-home">← All plants</button>
        <div class="detail-title">${esc(p.name)}</div>
        <div class="detail-meta">
          <span class="tag tag-loc" style="background:${color}22;color:${color};">${LOCATION_ICONS[p.location]} ${esc(p.location)}</span>
          ${sowDays !== null ? `<span class="tag tag-day">Day ${sowDays}</span>` : ""}
        </div>

        <div class="section-card">
          <div class="section-label">Sowing</div>
          <div class="date-row">
            <span class="date-label">Sow date</span>
            ${dateInput("sowDate", p.sowDate)}
          </div>
          <div class="date-row" style="border-bottom:none;">
            <span class="date-label">Quantity sown</span>
            <div style="display:flex;align-items:center;gap:6px;">
              ${numInput("quantity-input", p.quantity)}
              <span style="font-size:12px;color:#888;font-family:sans-serif;">plants</span>
            </div>
          </div>
        </div>

        <div class="section-card">
          <div class="section-label">Germination</div>
          <div class="date-row">
            <span class="date-label">Period</span>
            <div style="display:flex;align-items:center;gap:6px;">
              ${numInput("germ-days-input", p.germinationDays, { width: "56px", max: 365 })}
              <span style="font-size:12px;color:#888;font-family:sans-serif;">days</span>
            </div>
          </div>
          <div class="date-row">
            <span class="date-label">Temperature</span>
            <input type="text" id="germ-temp-input" value="${esc(p.germinationTemp || "")}" placeholder="e.g. 20–25°C"
              style="width:110px;padding:4px 8px;border:1px solid #b5d0b5;border-radius:6px;font-size:12px;background:#f0f7f0;color:#2d4a2d;font-family:sans-serif;">
          </div>
          <div class="date-row">
            <span class="date-label" style="color:#aaa;">Est. germination</span>
            ${estGermDisplay}
          </div>
          <div class="date-row">
            <span class="date-label">Germination date</span>
            ${dateInput("germinationDate", p.germinationDate)}
          </div>
          <div class="date-row" style="border-bottom:none;">
            <span class="date-label">Quantity germinated</span>
            <div style="display:flex;align-items:center;gap:6px;">
              ${numInput("germinated-qty-input", p.germinatedQuantity)}
              <span style="font-size:12px;color:#888;font-family:sans-serif;">plants</span>
            </div>
          </div>
        </div>

        <div class="section-card">
          <div class="section-label">Harvest</div>
          <div class="date-row">
            <span class="date-label">Days to harvest</span>
            <div style="display:flex;align-items:center;gap:6px;">
              ${numInput("harvest-days-input", p.harvestDays, { width: "56px", max: 365 })}
              <span style="font-size:12px;color:#888;font-family:sans-serif;">days</span>
            </div>
          </div>
          <div class="date-row">
            <span class="date-label" style="color:#aaa;">Est. harvest</span>
            ${estHarvestDisplay}
          </div>
          <div class="date-row">
            <span class="date-label">Harvest date</span>
            ${dateInput("harvestDate", p.harvestDate)}
          </div>
          <div class="date-row" style="border-bottom:none;">
            <span class="date-label">Temperature</span>
            <input type="text" id="harvest-temp-input" value="${esc(p.harvestTemp || "")}" placeholder="e.g. 20–25°C"
              style="width:110px;padding:4px 8px;border:1px solid #b5d0b5;border-radius:6px;font-size:12px;background:#f0f7f0;color:#2d4a2d;font-family:sans-serif;">
          </div>
        </div>

        <div class="section-card">
          <div class="section-label">Care</div>
          <div class="date-row">
            <span class="date-label">Location</span>
            <select class="location-select" id="loc-select">${locOptions}</select>
          </div>
          <div class="date-row">
            <span class="date-label">Potted on</span>
            ${dateInput("potOnDate", p.potOnDate)}
          </div>
          <div class="date-row">
            <span class="date-label">Last fed</span>
            ${dateInput("lastFed", p.lastFed)}
          </div>
          <div class="date-row">
            <span class="date-label">Feed every</span>
            <div style="display:flex;align-items:center;gap:6px;">
              ${numInput("feed-every-input", p.feedEvery, { width: "56px", max: 365 })}
              <span style="font-size:12px;color:#888;font-family:sans-serif;">days</span>
            </div>
          </div>
          ${nextFeedDisplay}
        </div>

        <div class="section-card">
          <div class="section-label">Add a note</div>
          <textarea class="note-textarea" id="note-input" rows="3"
            placeholder="e.g. Pinched out growing tip, spotted yellowing on lower leaves...">${esc(state.currentNote)}</textarea>
          <button class="save-note-btn" id="save-note">Save note</button>
        </div>

        ${notes}`;
    }

    // ── Events ─────────────────────────────────────────────────────────────
    function attachEvents() {
      if (state.view === "home") {

        document.getElementById("toggle-storage")?.addEventListener("click", () => {
          state.storageOpen = !state.storageOpen;
          state.snapshotName = "";
          render();
        });

        // Storage panel events
        if (state.storageOpen) {
          document.getElementById("snap-name")?.addEventListener("input", e => {
            state.snapshotName = e.target.value;
          });

          document.getElementById("do-save-snap")?.addEventListener("click", () => {
            const name = document.getElementById("snap-name")?.value?.trim();
            if (!name) return;
            saveSnapshot(name);
            state.snapshotName = "";
            render();
          });

          document.getElementById("snap-name")?.addEventListener("keydown", e => {
            if (e.key === "Enter") document.getElementById("do-save-snap")?.click();
          });

          document.querySelectorAll("[data-load-snap]").forEach(btn => {
            btn.addEventListener("click", () => loadSnapshot(btn.dataset.loadSnap));
          });

          document.querySelectorAll("[data-del-snap]").forEach(btn => {
            btn.addEventListener("click", () => {
              deleteSnapshot(btn.dataset.delSnap);
            });
          });

          document.getElementById("import-text")?.addEventListener("input", e => {
            state.importText = e.target.value;
          });

          document.getElementById("do-import")?.addEventListener("click", () => {
            importFromText(document.getElementById("import-text")?.value || "");
          });

          document.getElementById("load-sample")?.addEventListener("click", () => {
            if (!confirm("Load sample data? This will replace all current plant data.")) return;
            state.plants = JSON.parse(JSON.stringify(SAMPLE_PLANTS));
            savePlants();
            render();
          });

          document.getElementById("do-reset")?.addEventListener("click", () => {
            if (!confirm("Reset to default? All plant data will be cleared.")) return;
            localStorage.removeItem(STORAGE_KEY);
            state.plants = JSON.parse(JSON.stringify(INITIAL_PLANTS));
            render();
          });
        }

        // Delete plant buttons
        document.querySelectorAll(".delete-plant-btn").forEach(btn => {
          btn.addEventListener("click", e => {
            e.stopPropagation();
            deletePlant(parseInt(btn.dataset.delPlant));
          });
        });

        // Schedule overview items
        document.querySelectorAll(".ov-item").forEach(item => {
          item.addEventListener("click", () => {
            state.selectedPlantId = parseInt(item.dataset.open);
            state.currentNote = "";
            state.view = "detail";
            render();
          });
        });

        // Plant cards
        document.querySelectorAll(".plant-card").forEach(card => {
          card.addEventListener("click", e => {
            if (e.target.closest(".quick-actions")) return;
            state.selectedPlantId = parseInt(card.dataset.open);
            state.currentNote = "";
            state.view = "detail";
            render();
          });
        });

        document.querySelectorAll(".quick-btn").forEach(btn => {
          btn.addEventListener("click", e => {
            e.stopPropagation();
            const type    = btn.dataset.action;
            const plantId = parseInt(btn.dataset.plant);
            const today   = todayStr();

            if (type === "sow")     { updatePlant(plantId, { sowDate: today }); }
            if (type === "germ")    { updatePlant(plantId, { germinationDate: today }); }
            if (type === "poton")   { updatePlant(plantId, { potOnDate: today }); }
            if (type === "fed")     { updatePlant(plantId, { lastFed: today }); }
            if (type === "harvest") { updatePlant(plantId, { harvestDate: today }); }
            if (type === "move")  {
              state.selectedPlantId = plantId;
              state.currentNote = "";
              state.view = "detail";
              render();
              setTimeout(() => document.getElementById("loc-select")?.focus(), 50);
              return;
            }
            render();
          });
        });

        document.getElementById("start-add")?.addEventListener("click", () => {
          state.addingPlant = true;
          render();
          document.getElementById("new-plant-name")?.focus();
        });

        document.getElementById("confirm-add")?.addEventListener("click", confirmAddPlant);

        document.getElementById("new-plant-name")?.addEventListener("keydown", e => {
          if (e.key === "Enter") confirmAddPlant();
        });

        document.getElementById("cancel-add")?.addEventListener("click", () => {
          state.addingPlant = false;
          render();
        });
      }

      if (state.view === "detail") {
        document.getElementById("back-home")?.addEventListener("click", () => {
          state.view = "home";
          render();
        });

        document.querySelectorAll(".date-input").forEach(input => {
          input.addEventListener("change", () => {
            if (!input.value) return;
            const field = input.dataset.field;
            updatePlant(state.selectedPlantId, { [field]: input.value });
            state.currentNote = document.getElementById("note-input")?.value || "";
            render();
          });
        });

        document.getElementById("feed-every-input")?.addEventListener("change", e => {
          const val = parseInt(e.target.value);
          updatePlant(state.selectedPlantId, { feedEvery: val > 0 ? val : null });
          state.currentNote = document.getElementById("note-input")?.value || "";
          render();
        });

        document.getElementById("quantity-input")?.addEventListener("change", e => {
          const val = parseInt(e.target.value);
          updatePlant(state.selectedPlantId, { quantity: val > 0 ? val : null });
          state.currentNote = document.getElementById("note-input")?.value || "";
          render();
        });

        document.getElementById("germ-days-input")?.addEventListener("change", e => {
          const val = parseInt(e.target.value);
          updatePlant(state.selectedPlantId, { germinationDays: val > 0 ? val : null });
          state.currentNote = document.getElementById("note-input")?.value || "";
          render();
        });

        document.getElementById("germ-temp-input")?.addEventListener("change", e => {
          const val = e.target.value.trim();
          updatePlant(state.selectedPlantId, { germinationTemp: val || null });
          state.currentNote = document.getElementById("note-input")?.value || "";
          render();
        });

        document.getElementById("germinated-qty-input")?.addEventListener("change", e => {
          const val = parseInt(e.target.value);
          updatePlant(state.selectedPlantId, { germinatedQuantity: val > 0 ? val : null });
          state.currentNote = document.getElementById("note-input")?.value || "";
          render();
        });

        document.getElementById("harvest-days-input")?.addEventListener("change", e => {
          const val = parseInt(e.target.value);
          updatePlant(state.selectedPlantId, { harvestDays: val > 0 ? val : null });
          state.currentNote = document.getElementById("note-input")?.value || "";
          render();
        });

        document.getElementById("harvest-temp-input")?.addEventListener("change", e => {
          const val = e.target.value.trim();
          updatePlant(state.selectedPlantId, { harvestTemp: val || null });
          state.currentNote = document.getElementById("note-input")?.value || "";
          render();
        });

        document.getElementById("loc-select")?.addEventListener("change", e => {
          updatePlant(state.selectedPlantId, { location: e.target.value });
          state.currentNote = document.getElementById("note-input")?.value || "";
          render();
        });

        document.getElementById("note-input")?.addEventListener("input", e => {
          state.currentNote = e.target.value;
        });

        document.getElementById("save-note")?.addEventListener("click", () => {
          const note = document.getElementById("note-input")?.value?.trim();
          if (!note) return;
          logEvent(state.selectedPlantId, "note", note);
          state.currentNote = "";
          render();
        });
      }

    }

    function confirmAddPlant() {
      const name = document.getElementById("new-plant-name")?.value?.trim();
      if (!name) return;
      state.plants.push({
        id: Date.now(), name, variety: "", sowDate: null,
        potOnDate: null, lastFed: null, feedEvery: null,
        location: "indoor (grow light)", events: [],
        quantity: null, germinationDays: null, germinationTemp: null,
        germinationDate: null, germinatedQuantity: null,
      });
      savePlants();
      state.addingPlant = false;
      render();
    }

    // ── Boot ───────────────────────────────────────────────────────────────
    render();
  </script>
</body>
</html>
