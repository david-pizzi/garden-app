<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Violetta's Growing Journal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Georgia, serif;
      background: #f5f0eb;
      color: #2d3a2d;
      min-height: 100vh;
    }

    #app {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 16px 80px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 4px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: normal;
      color: #2d4a2d;
      line-height: 1.2;
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .header-icon { font-size: 28px; }

    .manage-btn {
      font-size: 11px;
      color: #8a9a8a;
      background: none;
      border: none;
      cursor: pointer;
      font-family: sans-serif;
      padding: 0;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .manage-btn.active { color: #2d4a2d; }

    .date-line {
      font-size: 13px;
      color: #8a9a8a;
      font-family: sans-serif;
      margin-bottom: 20px;
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      border-bottom: 2px solid #ede8e0;
      margin-bottom: 20px;
    }

    .tab-btn {
      padding: 8px 20px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      font-size: 14px;
      font-family: Georgia, serif;
      color: #8a9a8a;
      cursor: pointer;
    }

    .tab-btn.active {
      color: #2d4a2d;
      border-bottom-color: #2d4a2d;
    }

    /* ── Summary strip ── */
    .summary-strip {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .summary-chip {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      background: #fff;
      border-radius: 20px;
      font-size: 13px;
      font-family: sans-serif;
      border: 1px solid #ede8e0;
    }

    /* ── Schedule Overview ── */
    .schedule-overview {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ov-section {
      background: #fff;
      border-radius: 10px;
      border: 1px solid #ede8e0;
      border-left: 3px solid #ccc;
      overflow: hidden;
    }

    .ov-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 12px;
      background: #fafaf8;
      border-bottom: 1px solid #f4f0ea;
    }

    .ov-section-label {
      font-family: sans-serif;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #8a9a8a;
    }

    .ov-badge {
      font-family: sans-serif;
      font-size: 11px;
      font-weight: 700;
      background: #f0ece6;
      color: #7a8a7a;
      padding: 1px 7px;
      border-radius: 10px;
    }

    .page-section-label {
      font-family: sans-serif;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #b0beb0;
      margin-bottom: 10px;
    }

    .location-group-label {
      font-family: sans-serif;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin: 18px 0 8px;
      opacity: 0.75;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      background: none;
      border: none;
      padding: 0;
      width: 100%;
      text-align: left;
    }
    .location-group-label:first-child {
      margin-top: 0;
    }
    .location-group-chevron {
      font-style: normal;
      font-size: 13px;
      opacity: 0.5;
      transition: transform 0.15s;
    }
    .location-group-chevron.collapsed {
      transform: rotate(-90deg);
    }

    .bed-group-label {
      font-family: sans-serif;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 12px 0 6px 4px;
      opacity: 0.6;
    }

    .ov-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid #f9f6f2;
      cursor: pointer;
      font-family: sans-serif;
    }

    .ov-item:last-child { border-bottom: none; }
    .ov-item:active { background: #f4f0ea; }

    .ov-loc { font-size: 15px; flex-shrink: 0; }
    .ov-name { flex: 1; color: #2d4a2d; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ov-action { color: #6a7a6a; font-size: 12px; white-space: nowrap; flex-shrink: 0; }
    .ov-date { color: #aabcaa; font-size: 11px; white-space: nowrap; flex-shrink: 0; margin-left: 4px; }

    /* ── Storage panel ── */
    .storage-panel {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #b5d0b5;
      margin-bottom: 20px;
    }

    .snap-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid #f4f0ea;
    }

    .snap-row:last-child { border-bottom: none; }

    .snap-name {
      flex: 1;
      font-size: 14px;
      color: #2d4a2d;
    }

    .btn-sm {
      padding: 5px 10px;
      background: #f0ece6;
      color: #555;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-family: sans-serif;
    }

    .btn-danger {
      padding: 5px 10px;
      background: #fff0f0;
      color: #cc4a20;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-family: sans-serif;
    }

    .io-row {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .io-btn {
      flex: 1;
      padding: 9px;
      background: #f0f7f0;
      color: #2d4a2d;
      border: 1px solid #b5d0b5;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      font-family: sans-serif;
      text-align: center;
    }

    /* ── Plant cards ── */
    .plant-card {
      background: #fff;
      border-radius: 12px;
      margin-bottom: 12px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      border: 1px solid #ede8e0;
      cursor: pointer;
    }

    .plant-card-main {
      display: flex;
      align-items: center;
      padding: 14px;
      gap: 12px;
    }

    .location-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .plant-name {
      font-size: 15px;
      color: #2d4a2d;
      margin-bottom: 4px;
    }

    .plant-meta { display: flex; gap: 6px; flex-wrap: wrap; }

    .tag {
      font-size: 11px;
      font-family: sans-serif;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .tag-loc  { background: #f0f7f0; color: #3a6a3a; }
    .tag-day  { background: #f0f4ff; color: #4a5aaa; }
    .tag-due  { background: #fff3f0; color: #cc4a20; font-weight: 600; }

    .chevron { color: #c0d0c0; margin-left: auto; font-size: 20px; line-height: 1; }

    /* ── Quick actions ── */
    .quick-actions {
      display: flex;
      border-top: 1px solid #f0ece6;
    }

    .quick-btn {
      flex: 1;
      padding: 8px 2px;
      background: none;
      border: none;
      border-right: 1px solid #f0ece6;
      font-size: 10px;
      cursor: pointer;
      font-family: sans-serif;
      color: #5a7a5a;
    }

    .quick-btn:last-child { border-right: none; }
    .quick-btn.done { color: #059669; font-weight: 600; }

    /* ── Add plant ── */
    .add-plant-btn {
      width: 100%;
      padding: 14px;
      background: none;
      border: 2px dashed #b5c9b5;
      border-radius: 12px;
      color: #5a8a5a;
      font-size: 14px;
      cursor: pointer;
      font-family: Georgia, serif;
    }

    .add-plant-form {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #ede8e0;
    }

    .input-text {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d0ddd0;
      border-radius: 8px;
      font-size: 14px;
      font-family: Georgia, serif;
      margin-bottom: 10px;
    }

    .btn-row { display: flex; gap: 8px; }

    .btn-primary {
      flex: 1;
      padding: 10px;
      background: #2d4a2d;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      font-family: Georgia, serif;
    }

    .btn-secondary {
      padding: 10px 16px;
      background: #f0ece6;
      color: #555;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }

    /* ── Detail view ── */
    .back-btn {
      background: none;
      border: none;
      color: #a8c5a0;
      font-size: 14px;
      cursor: pointer;
      padding: 0;
      margin-bottom: 12px;
      font-family: Georgia, serif;
      display: block;
    }

    .detail-title {
      font-size: 22px;
      color: #2d4a2d;
      margin-bottom: 8px;
    }

    .detail-meta {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .section-card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #ede8e0;
      margin-bottom: 12px;
    }

    .section-label {
      font-size: 11px;
      color: #8a9a8a;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 12px;
      font-family: sans-serif;
    }

    .date-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #f4f0ea;
    }

    .date-row:last-child { border-bottom: none; }

    .date-label {
      font-size: 13px;
      color: #555;
      font-family: sans-serif;
    }

    .date-value {
      font-size: 12px;
      color: #555;
      font-family: sans-serif;
      margin-right: 8px;
    }

    .date-input {
      padding: 4px 8px;
      border: 1px solid #b5d0b5;
      border-radius: 6px;
      font-size: 12px;
      background: #f0f7f0;
      color: #2d4a2d;
      font-family: sans-serif;
      cursor: pointer;
    }

    .location-select {
      padding: 4px 8px;
      border: 1px solid #b5d0b5;
      border-radius: 6px;
      font-size: 12px;
      background: #f0f7f0;
      color: #3a6a3a;
      font-family: sans-serif;
    }

    .note-textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #d5e5d5;
      border-radius: 8px;
      font-size: 14px;
      font-family: Georgia, serif;
      resize: none;
      margin-bottom: 8px;
    }

    .save-note-btn {
      padding: 10px;
      background: #2d4a2d;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      font-family: Georgia, serif;
    }

    /* ── Event log ── */
    .event-row {
      display: flex;
      gap: 10px;
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid #f4f0ea;
    }

    .event-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

    .event-date {
      font-size: 11px;
      color: #8a9a8a;
      font-family: sans-serif;
      white-space: nowrap;
      padding-top: 2px;
      min-width: 72px;
    }

    .event-type {
      font-size: 12px;
      background: #f0f7f0;
      color: #3a6a3a;
      border-radius: 4px;
      padding: 2px 6px;
      font-family: sans-serif;
      margin-right: 6px;
    }

    .event-detail { font-size: 13px; color: #444; }

    /* ── Card dates row ── */
    .plant-dates {
      font-size: 11px;
      color: #7a8a7a;
      font-family: sans-serif;
      margin-top: 5px;
    }

    .plant-dates span { margin-right: 8px; }

    /* ── Delete plant button ── */
    .delete-plant-btn {
      background: none;
      border: none;
      color: #ccc;
      font-size: 16px;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
      flex-shrink: 0;
    }

    .delete-plant-btn:hover { color: #cc4a20; }

    /* ── Seed cards ── */
    .seed-card {
      background: #fff;
      border-radius: 12px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      border: 1px solid #ede8e0;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 14px;
      gap: 12px;
    }

    .seed-card:active { background: #f9f6f2; }

    .seed-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: #fdf6e3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .seed-name {
      font-size: 15px;
      color: #2d4a2d;
      margin-bottom: 4px;
    }

    .seed-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }

    .expiry-ok      { background: #f0f7f0; color: #3a6a3a; }
    .expiry-soon    { background: #fffbeb; color: #b45309; }
    .expiry-expired { background: #fff0f0; color: #cc4a20; font-weight: 600; }

    .seed-empty {
      text-align: center;
      font-family: sans-serif;
      font-size: 13px;
      color: #b0beb0;
      padding: 32px 0 20px;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const INITIAL_PLANTS = [
      { id: 1, name: "Dragon Egg Cucumber", variety: "Dragon Egg",    sowDate: null, potOnDate: null, lastFed: null, feedEvery: null, location: "indoor (grow light)", events: [], quantity: null, germinationDays: null, germinationTemp: null, germinationDate: null, germinatedQuantity: null, harvestDays: null, harvestDate: null, harvestTemp: null },
      { id: 2, name: "Melba Melon",          variety: "Melba",        sowDate: null, potOnDate: null, lastFed: null, feedEvery: null, location: "greenhouse",           events: [], quantity: null, germinationDays: null, germinationTemp: null, germinationDate: null, germinatedQuantity: null, harvestDays: null, harvestDate: null, harvestTemp: null },
      { id: 3, name: "Cosmic Fusion Tomato", variety: "Cosmic Fusion",sowDate: null, potOnDate: null, lastFed: null, feedEvery: null, location: "indoor (grow light)", events: [], quantity: null, germinationDays: null, germinationTemp: null, germinationDate: null, germinatedQuantity: null, harvestDays: null, harvestDate: null, harvestTemp: null },
      { id: 4, name: "Black Cherry Tomato",  variety: "Black Cherry", sowDate: null, potOnDate: null, lastFed: null, feedEvery: null, location: "indoor (grow light)", events: [], quantity: null, germinationDays: null, germinationTemp: null, germinationDate: null, germinatedQuantity: null, harvestDays: null, harvestDate: null, harvestTemp: null },
      { id: 5, name: "Habanada Pepper",      variety: "Habanada",     sowDate: null, potOnDate: null, lastFed: null, feedEvery: null, location: "greenhouse",           events: [], quantity: null, germinationDays: null, germinationTemp: null, germinationDate: null, germinatedQuantity: null, harvestDays: null, harvestDate: null, harvestTemp: null },
      { id: 6, name: "Strawflower",          variety: "Mixed",        sowDate: null, potOnDate: null, lastFed: null, feedEvery: null, location: "indoor (grow light)", events: [], quantity: null, germinationDays: null, germinationTemp: null, germinationDate: null, germinatedQuantity: null, harvestDays: null, harvestDate: null, harvestTemp: null },
      { id: 7, name: "Leek",                 variety: "Direct sown",  sowDate: null, potOnDate: null, lastFed: null, feedEvery: null, location: "greenhouse",           events: [], quantity: null, germinationDays: null, germinationTemp: null, germinationDate: null, germinatedQuantity: null, harvestDays: null, harvestDate: null, harvestTemp: null },
    ];

    const LOCATIONS = ["indoor (grow light)", "greenhouse", "raised bed", "hardening off", "outdoor"];

    const LOCATION_COLORS = {
      "indoor (grow light)": "#7c3aed",
      "greenhouse":          "#059669",
      "raised bed":          "#b45309",
      "hardening off":       "#0369a1",
      "outdoor":             "#16a34a",
    };

    const LOCATION_ICONS = {
      "indoor (grow light)": "💡",
      "greenhouse":          "🌿",
      "raised bed":          "🌱",
      "hardening off":       "🌤️",
      "outdoor":             "☀️",
    };

    const STORAGE_KEY     = "violetta-garden-tracker-v1";
    const SNAPSHOT_PREFIX = "violetta-snap-";

    const AZURE_OAI_ENDPOINT   = "https://garden-app-oai-6a3fb.openai.azure.com/";
    const AZURE_OAI_DEPLOYMENT = "gpt-4o-mini";
    const AZURE_OAI_API_VER    = "2024-10-21";
    const AZURE_OAI_KEY_ENC    = {
      salt: "5nmHfJoNe8dSxWUgoYznAA==",
      iv:   "WL4+K3XADpCC8dQE",
      data: "n7fZKl49i1vtqi9LhwLJRgAwER6bJbI7ZCA+Xy1ifoGHtR5Ix57zUIXcbEj7KVwuPHYMsIWhMy/8eaWDjqq1BS5la2f+08VSaXsDiZyR4NgeMqjUE7VdTl8jA4rHXjeAdt3CxQ=="
    };
    let _oaiKey = null;

    async function getOaiKey() {
      if (_oaiKey) return _oaiKey;
      const passphrase = prompt("Scan passphrase:");
      if (!passphrase) throw new Error("Passphrase required");
      try {
        const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
        const keyMaterial = await crypto.subtle.importKey(
          "raw", new TextEncoder().encode(passphrase), "PBKDF2", false, ["deriveKey"]
        );
        const aesKey = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: b64(AZURE_OAI_KEY_ENC.salt), iterations: 100000, hash: "SHA-256" },
          keyMaterial, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
        );
        const decrypted = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: b64(AZURE_OAI_KEY_ENC.iv) }, aesKey, b64(AZURE_OAI_KEY_ENC.data)
        );
        _oaiKey = new TextDecoder().decode(decrypted);
        return _oaiKey;
      } catch {
        throw new Error("Wrong passphrase");
      }
    }

    // ── State ──────────────────────────────────────────────────────────────
    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return { plants: INITIAL_PLANTS, seeds: [] };
        const parsed = JSON.parse(saved);
        // Migrate old format (bare plants array) to envelope format
        if (Array.isArray(parsed)) return { plants: parsed, seeds: [] };
        return { plants: parsed.plants ?? INITIAL_PLANTS, seeds: parsed.seeds ?? [] };
      } catch { return { plants: INITIAL_PLANTS, seeds: [] }; }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ plants: state.plants, seeds: state.seeds }));
      } catch {
        alert("Could not save — storage may be full. Export your data from the manage panel to avoid losing it.");
      }
    }

    const { plants: _plants, seeds: _seeds } = loadState();

    const state = {
      plants:             _plants,
      seeds:              _seeds,
      view:               "home",
      activeTab:          "plants",
      selectedPlantId:    null,
      selectedSeedId:     null,
      addingPlant:        false,
      addingSeed:         false,
      currentNote:        "",
      storageOpen:        false,
      snapshotName:       "",
      importText:         "",
      collapsedLocations: new Set(),
    };

    // ── Helpers ────────────────────────────────────────────────────────────
    function daysSince(dateStr) {
      if (!dateStr) return null;
      return Math.floor((Date.now() - new Date(dateStr).getTime()) / 86400000);
    }

    function formatDate(dateStr) {
      if (!dateStr) return "—";
      return new Date(dateStr).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
    }

    function todayStr() {
      return new Date().toISOString().split("T")[0];
    }

    function feedStatus(plant) {
      if (!plant.feedEvery || !plant.lastFed) return null;
      const daysUntil = plant.feedEvery - daysSince(plant.lastFed);
      const next = new Date(plant.lastFed);
      next.setDate(next.getDate() + plant.feedEvery);
      return { daysUntil, nextDate: next.toISOString().split("T")[0] };
    }

    function estimatedGerminationDate(plant) {
      if (!plant.sowDate || !plant.germinationDays) return null;
      const d = new Date(plant.sowDate);
      d.setDate(d.getDate() + plant.germinationDays);
      return d.toISOString().split("T")[0];
    }

    function estimatedHarvestDate(plant) {
      const baseDate = plant.cropType === "transplanted" ? plant.transplantDate : plant.sowDate;
      if (!baseDate || !plant.harvestDays) return null;
      const d = new Date(baseDate);
      d.setDate(d.getDate() + plant.harvestDays);
      return d.toISOString().split("T")[0];
    }

    function shortAgo(dateStr) {
      if (!dateStr) return null;
      const d = daysSince(dateStr);
      if (d === 0) return "today";
      if (d === 1) return "yesterday";
      return `${d}d ago`;
    }

    function nextAction(plant) {
      if (plant.harvestDate) return null;
      const fs = feedStatus(plant);
      const today = todayStr();
      const todayMs = new Date(today).setHours(0, 0, 0, 0);
      const msDay = 86400000;

      if (fs && fs.daysUntil < 0)
        return { emoji: "🔴", label: `Feed ${Math.abs(fs.daysUntil)}d overdue`, color: "#cc4a20", bg: "#fff0f0" };

      const estHarvest = estimatedHarvestDate(plant);
      if (estHarvest) {
        const d = Math.round((new Date(estHarvest).setHours(0, 0, 0, 0) - todayMs) / msDay);
        if (d <= 0)
          return { emoji: "🟢", label: d === 0 ? "Harvest now" : `Harvest ${Math.abs(d)}d overdue`, color: "#059669", bg: "#f0fff4" };
        if (d <= 5)
          return { emoji: "🟡", label: `Harvest in ${d}d`, color: "#b45309", bg: "#fffbeb" };
      }

      if (fs && fs.daysUntil === 0) return { emoji: "🟡", label: "Feed today",    color: "#b45309", bg: "#fffbeb" };
      if (fs && fs.daysUntil === 1) return { emoji: "🟡", label: "Feed tomorrow", color: "#b45309", bg: "#fffbeb" };

      if (estHarvest) {
        const d = Math.round((new Date(estHarvest).setHours(0, 0, 0, 0) - todayMs) / msDay);
        if (d <= 14)
          return { emoji: "🔵", label: `Harvest in ${d}d`, color: "#0369a1", bg: "#eff6ff" };
      }

      if (fs)
        return { emoji: "🔵", label: `Feed in ${fs.daysUntil}d`, color: "#0369a1", bg: "#eff6ff" };

      return null;
    }

    function getSeedExpiryStatus(expirationYear) {
      if (!expirationYear) return null;
      const currentYear = new Date().getFullYear();
      const yr = parseInt(expirationYear);
      if (yr < currentYear)       return { label: `Expired ${yr}`,        cls: "expiry-expired" };
      if (yr <= currentYear + 1)  return { label: `Expires ${yr}`,        cls: "expiry-soon" };
      return                             { label: `Expires ${yr}`,         cls: "expiry-ok" };
    }

    function esc(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // ── Plant mutations ────────────────────────────────────────────────────
    function updatePlant(id, updates) {
      state.plants = state.plants.map(p => p.id === id ? { ...p, ...updates } : p);
      saveState();
    }

    function deletePlant(id) {
      if (!confirm(`Delete this plant? This cannot be undone.`)) return;
      state.plants = state.plants.filter(p => p.id !== id);
      saveState();
      render();
    }

    function logEvent(plantId, type, detail = "") {
      const ev = { date: todayStr(), type, detail };
      state.plants = state.plants.map(p =>
        p.id === plantId
          ? { ...p, events: [ev, ...(p.events || [])].slice(0, 30) }
          : p
      );
      saveState();
    }

    // ── Seed mutations ─────────────────────────────────────────────────────
    function updateSeed(id, updates) {
      state.seeds = state.seeds.map(s => s.id === id ? { ...s, ...updates } : s);
      saveState();
    }

    function deleteSeed(id) {
      if (!confirm(`Delete this seed? This cannot be undone.`)) return;
      state.seeds = state.seeds.filter(s => s.id !== id);
      saveState();
      state.view = "home";
      state.activeTab = "seeds";
      render();
    }

    function logSeedNote(seedId, note) {
      const ev = { date: todayStr(), type: "note", detail: note };
      state.seeds = state.seeds.map(s =>
        s.id === seedId
          ? { ...s, notes: [ev, ...(s.notes || [])].slice(0, 30) }
          : s
      );
      saveState();
    }

    // ── Storage management ─────────────────────────────────────────────────
    function listSnapshots() {
      const names = [];
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith(SNAPSHOT_PREFIX)) {
          names.push(key.slice(SNAPSHOT_PREFIX.length));
        }
      }
      return names.sort();
    }

    function saveSnapshot(name) {
      if (!name.trim()) return;
      localStorage.setItem(SNAPSHOT_PREFIX + name.trim(), JSON.stringify({ plants: state.plants, seeds: state.seeds }));
    }

    function loadSnapshot(name) {
      try {
        const data = localStorage.getItem(SNAPSHOT_PREFIX + name);
        if (!data) return;
        const parsed = JSON.parse(data);
        if (Array.isArray(parsed)) {
          state.plants = parsed;
          state.seeds = [];
        } else {
          state.plants = parsed.plants ?? [];
          state.seeds  = parsed.seeds  ?? [];
        }
        saveState();
        state.storageOpen = false;
        render();
      } catch { alert("Could not load snapshot."); }
    }

    function deleteSnapshot(name) {
      if (!confirm(`Delete snapshot "${name}"?`)) return;
      localStorage.removeItem(SNAPSHOT_PREFIX + name);
      render();
    }

    function importFromText(text) {
      try {
        const data = JSON.parse(text);
        if (Array.isArray(data)) {
          if (!confirm(`Import ${data.length} plants? This will replace your current data.`)) return;
          state.plants = data;
        } else if (data && (data.plants || data.seeds)) {
          const pc = (data.plants || []).length;
          const sc = (data.seeds  || []).length;
          if (!confirm(`Import ${pc} plants and ${sc} seeds? This will replace your current data.`)) return;
          state.plants = data.plants ?? [];
          state.seeds  = data.seeds  ?? [];
        } else {
          throw new Error();
        }
        saveState();
        state.storageOpen = false;
        state.importText = "";
        render();
      } catch { alert("Invalid JSON — paste a valid garden data export."); }
    }

    // ── Render ─────────────────────────────────────────────────────────────
    function render() {
      let html;
      if (state.view === "detail")      html = renderDetail();
      else if (state.view === "seed-detail") html = renderSeedDetail();
      else                              html = renderHome();
      document.getElementById("app").innerHTML = html;
      attachEvents();
    }

    function renderStoragePanel() {
      const snaps = listSnapshots();

      const snapRows = snaps.length > 0 ? `
        <div class="section-label" style="margin-top:14px;">Saved snapshots</div>
        ${snaps.map(name => `
          <div class="snap-row">
            <span class="snap-name">${esc(name)}</span>
            <button class="btn-sm" data-load-snap="${esc(name)}">Load</button>
            <button class="btn-danger" data-del-snap="${esc(name)}">Delete</button>
          </div>`).join("")}` : "";

      return `
        <div class="storage-panel">
          <div class="section-label">Save a snapshot</div>
          <div style="display:flex;gap:8px;">
            <input id="snap-name" class="input-text" type="text" placeholder="e.g. Week 3, Before repot…"
              value="${esc(state.snapshotName)}" style="margin-bottom:0;flex:1;">
            <button class="btn-primary" id="do-save-snap" style="flex:none;padding:10px 14px;font-size:13px;">Save</button>
          </div>
          ${snapRows}
          <div class="section-label" style="margin-top:14px;">Export</div>
          <textarea class="note-textarea" rows="4" readonly
            onclick="this.select()"
            style="font-family:monospace;font-size:11px;color:#444;cursor:pointer;"
            title="Click to select all, then copy"
          >${esc(JSON.stringify({ plants: state.plants, seeds: state.seeds }, null, 2))}</textarea>

          <div class="section-label" style="margin-top:6px;">Import — paste JSON below</div>
          <textarea class="note-textarea" id="import-text" rows="4"
            placeholder="Paste exported JSON here…"
            style="font-family:monospace;font-size:11px;"
          >${esc(state.importText)}</textarea>
          <button class="save-note-btn" id="do-import">Load from text</button>

          <div class="section-label" style="margin-top:14px;">Danger zone</div>
          <button class="btn-secondary" id="load-sample" style="width:100%;padding:10px;margin-bottom:8px;">Load sample data</button>
          <button class="btn-danger" id="do-reset" style="width:100%;padding:10px;">Reset to default — clear all data</button>
        </div>`;
    }

    function renderScheduleOverview() {
      const today = todayStr();
      const todayMs = new Date(today).setHours(0, 0, 0, 0);
      const msDay = 86400000;

      const allEvents = [];
      for (const plant of state.plants) {
        const fs = feedStatus(plant);
        if (fs) {
          allEvents.push({ plant, type: "feed", daysUntil: fs.daysUntil, date: fs.nextDate });
        }
        if (!plant.germinationDate && plant.cropType !== "transplanted") {
          const est = estimatedGerminationDate(plant);
          if (est) {
            const daysUntil = Math.round((new Date(est).setHours(0, 0, 0, 0) - todayMs) / msDay);
            allEvents.push({ plant, type: "germ", daysUntil, date: est });
          }
        }
        if (!plant.harvestDate) {
          const est = estimatedHarvestDate(plant);
          if (est) {
            const daysUntil = Math.round((new Date(est).setHours(0, 0, 0, 0) - todayMs) / msDay);
            allEvents.push({ plant, type: "harvest", daysUntil, date: est });
          }
        }
      }

      const overdue       = allEvents.filter(e => e.daysUntil < 0).sort((a, b) => a.daysUntil - b.daysUntil);
      const todayItems    = allEvents.filter(e => e.daysUntil === 0);
      const tomorrowItems = allEvents.filter(e => e.daysUntil === 1);
      const weekItems     = allEvents.filter(e => e.daysUntil >= 2 && e.daysUntil <= 7).sort((a, b) => a.daysUntil - b.daysUntil);

      if (!overdue.length && !todayItems.length && !tomorrowItems.length && !weekItems.length)
        return `<div style="font-family:sans-serif;font-size:13px;color:#b0beb0;padding:12px 2px 20px;text-align:center;">All clear — nothing overdue or due this week 🌱</div>`;

      const renderItem = e => {
        const locIcon = LOCATION_ICONS[e.plant.location] || "🌱";
        let action;
        if (e.type === "feed") {
          action = e.daysUntil < 0  ? `💧 Feed ${Math.abs(e.daysUntil)}d overdue`
                 : e.daysUntil === 0 ? `💧 Feed today`
                 : e.daysUntil === 1 ? `💧 Feed tomorrow`
                 : `💧 Feed in ${e.daysUntil}d`;
        } else if (e.type === "germ") {
          action = e.daysUntil < 0  ? `🌿 Germination ${Math.abs(e.daysUntil)}d overdue`
                 : e.daysUntil === 0 ? `🌿 Germination today`
                 : e.daysUntil === 1 ? `🌿 Germination tomorrow`
                 : `🌿 Germinates in ${e.daysUntil}d`;
        } else {
          action = e.daysUntil < 0  ? `🌾 Harvest ${Math.abs(e.daysUntil)}d overdue`
                 : e.daysUntil === 0 ? `🌾 Harvest today`
                 : e.daysUntil === 1 ? `🌾 Harvest tomorrow`
                 : `🌾 Harvest in ${e.daysUntil}d`;
        }
        const dateChip = e.daysUntil >= 2 ? `<span class="ov-date">${formatDate(e.date)}</span>` : "";
        return `<div class="ov-item" data-open="${e.plant.id}">
          <span class="ov-loc">${locIcon}</span>
          <span class="ov-name">${esc(e.plant.name)}</span>
          <span class="ov-action">${action}</span>
          ${dateChip}
        </div>`;
      };

      const section = (label, items, borderColor) => {
        if (!items.length) return "";
        return `<div class="ov-section" style="border-left-color:${borderColor};">
          <div class="ov-section-header">
            <span class="ov-section-label">${label}</span>
            <span class="ov-badge">${items.length}</span>
          </div>
          ${items.map(renderItem).join("")}
        </div>`;
      };

      return `<div class="schedule-overview">
        ${section("Overdue", overdue, "#e8856a")}
        ${section("Today", todayItems, "#059669")}
        ${section("Tomorrow", tomorrowItems, "#3b82f6")}
        ${section("This week", weekItems, "#8ab58a")}
      </div>`;
    }

    function renderSeedList() {
      if (state.seeds.length === 0 && !state.addingSeed) {
        return `
          <div class="seed-empty">
            <div style="font-size:32px;margin-bottom:8px;">🌾</div>
            <div>No seeds yet</div>
            <div style="margin-top:4px;color:#c8d4c8;">Add your first packet below</div>
          </div>
          <button class="add-plant-btn" id="start-add-seed">+ Add a seed</button>
          <button class="add-plant-btn" id="start-scan-seed" style="margin-top:8px;color:#3a6a5a;border-color:#b5c9b5;">📷 Scan packet to add</button>`;
      }

      const cards = state.seeds.map(seed => {
        const expiry = getSeedExpiryStatus(seed.expirationYear);
        const tags = [
          seed.numberPerPacket != null ? `<span class="tag" style="background:#f5f0ff;color:#6b46c1;">×${seed.numberPerPacket} seeds</span>` : "",
          seed.sowingMonths   ? `<span class="tag tag-loc">🌱 ${esc(seed.sowingMonths)}</span>`   : "",
          seed.harvestMonths  ? `<span class="tag tag-loc">🌾 ${esc(seed.harvestMonths)}</span>`  : "",
          seed.position       ? `<span class="tag" style="background:#fdf6e3;color:#92630a;">☀️ ${esc(seed.position)}</span>` : "",
          expiry ? `<span class="tag ${expiry.cls}">${esc(expiry.label)}</span>` : "",
        ].filter(Boolean).join("");

        return `
          <div class="seed-card" data-open-seed="${seed.id}">
            <div class="seed-icon">🌾</div>
            <div style="flex:1;min-width:0;">
              <div class="seed-name">${esc(seed.name)}</div>
              <div class="seed-meta">${tags || '<span style="font-size:11px;color:#ccc;font-family:sans-serif;">No details added</span>'}</div>
            </div>
            <div class="chevron">›</div>
          </div>`;
      }).join("");

      const addSection = state.addingSeed ? `
        <div class="add-plant-form">
          <input id="new-seed-name" class="input-text" type="text" placeholder="Seed name (e.g. Tomato — Roma)" autofocus>
          <div class="btn-row">
            <button class="btn-primary" id="confirm-add-seed">Add Seed</button>
            <button class="btn-secondary" id="cancel-add-seed">Cancel</button>
          </div>
        </div>` : `
        <button class="add-plant-btn" id="start-add-seed">+ Add a seed</button>
        <button class="add-plant-btn" id="start-scan-seed" style="margin-top:8px;color:#3a6a5a;border-color:#b5c9b5;">📷 Scan packet to add</button>`;

      return cards + addSection;
    }

    function renderHome() {
      const today = new Date().toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });

      const header = `
        <div class="header">
          <h1>Violetta's<br>Growing Journal</h1>
          <div class="header-right">
            <span class="header-icon">🌿</span>
            <button class="manage-btn${state.storageOpen ? " active" : ""}" id="toggle-storage">
              ${state.storageOpen ? "✕ close" : "💾 manage data"}
            </button>
          </div>
        </div>
        <div class="date-line">${today}</div>
        ${state.storageOpen ? renderStoragePanel() : ""}
        <div class="tabs">
          <button class="tab-btn${state.activeTab === "plants" ? " active" : ""}" id="tab-plants">Plants</button>
          <button class="tab-btn${state.activeTab === "seeds"  ? " active" : ""}" id="tab-seeds">Seeds</button>
        </div>`;

      if (state.activeTab === "seeds") {
        return header + renderSeedList();
      }

      // ── Plants tab ──
      const chips = Object.entries(LOCATION_ICONS).map(([loc, icon]) => {
        const n = state.plants.filter(p => p.location === loc).length;
        return n > 0 ? `<div class="summary-chip">${icon} ${n}</div>` : "";
      }).join("");

      const sownCount       = state.plants.filter(p => p.sowDate).length;
      const germinatedCount = state.plants.filter(p => p.germinationDate).length;

      const grouped = {};
      LOCATIONS.forEach(loc => { grouped[loc] = []; });
      state.plants.forEach(plant => {
        const key = LOCATIONS.includes(plant.location) ? plant.location : LOCATIONS[LOCATIONS.length - 1];
        grouped[key].push(plant);
      });

      const renderCard = plant => {
        const isTransplanted = plant.cropType === "transplanted";
        const sowDays = isTransplanted ? daysSince(plant.transplantDate) : daysSince(plant.sowDate);
        const fs      = feedStatus(plant);
        const color   = LOCATION_COLORS[plant.location] || "#64748b";

        const estGermCard    = estimatedGerminationDate(plant);
        const estHarvestCard = estimatedHarvestDate(plant);
        const germOverdue    = !isTransplanted && !!(estGermCard && estGermCard < todayStr() && !plant.germinationDate);
        const qtyLabel = plant.quantity && plant.germinatedQuantity && plant.germinatedQuantity !== plant.quantity
          ? `×${plant.germinatedQuantity}/${plant.quantity}`
          : plant.quantity ? `×${plant.quantity}` : null;

        const na = nextAction(plant);
        const dayPart    = sowDays !== null ? `Day ${sowDays}` : "";
        const naPart     = na ? `${na.emoji} ${na.label}` : "";
        const combined   = [dayPart, naPart].filter(Boolean).join(" • ");
        const statusChip = combined
          ? `<span class="tag" style="background:${na ? na.bg : "#f0f4ff"};color:${na ? na.color : "#4a5a8a"};">${combined}</span>`
          : "";

        const tags = [
          `<span class="tag tag-loc">${esc(plant.location)}${plant.location === "raised bed" && plant.bedNumber != null ? " " + plant.bedNumber : ""}</span>`,
          qtyLabel ? `<span class="tag" style="background:#f5f0ff;color:#6b46c1;">${qtyLabel}</span>` : "",
          statusChip,
        ].join("");

        const feedPart = fs
          ? (fs.daysUntil <= 0 ? null
            : fs.daysUntil === 1 ? `🗓 <strong>Feed tomorrow</strong>`
            : `🗓 Next feed in ${fs.daysUntil}d`)
          : (plant.feedEvery && !plant.lastFed ? `🗓 Not yet fed` : null);

        const dateParts = [
          isTransplanted
            ? (plant.transplantDate ? `🪴 Transplanted ${formatDate(plant.transplantDate)}` : null)
            : (plant.sowDate        ? `🌱 Sown ${formatDate(plant.sowDate)}`                : null),
          plant.lastFed ? `💧 Fed ${shortAgo(plant.lastFed)}` : null,
          !isTransplanted && (plant.germinationDate
            ? `🌿 Germinated ${formatDate(plant.germinationDate)}`
            : estGermCard ? `🌿 Germinates ~${formatDate(estGermCard)}` : null),
          plant.harvestDate ? `🌾 Harvested ${formatDate(plant.harvestDate)}` :
          estHarvestCard    ? `🌾 Harvest ~${formatDate(estHarvestCard)}`     : null,
          feedPart,
        ].filter(Boolean);
        const datesRow = dateParts.length > 0
          ? `<div class="plant-dates">${dateParts.map(d => `<span>${d}</span>`).join("")}</div>`
          : "";

        const btns = (isTransplanted ? [
          { label: plant.sowDate         ? "✓ Sown"         : "+ Sow",         type: "sow",        done: !!plant.sowDate },
          { label: plant.germinationDate ? "✓ Germinated"   : "🌿 Germinate",  type: "germ",       done: !!plant.germinationDate },
          { label: plant.transplantDate  ? "✓ Transplanted" : "🪴 Transplant", type: "transplant", done: !!plant.transplantDate },
          { label: "💧 Fed",                                                     type: "fed",        done: false },
          { label: plant.harvestDate     ? "✓ Harvested"    : "🌾 Harvest",    type: "harvest",    done: !!plant.harvestDate },
          { label: "📍 Move",                                                    type: "move",       done: false },
        ] : [
          { label: plant.sowDate         ? "✓ Sown"         : "+ Sow",         type: "sow",        done: !!plant.sowDate },
          { label: plant.germinationDate ? "✓ Germinated"   : "🌿 Germinate",  type: "germ",       done: !!plant.germinationDate },
          { label: "💧 Fed",                                                     type: "fed",        done: false },
          { label: plant.harvestDate     ? "✓ Harvested"    : "🌾 Harvest",    type: "harvest",    done: !!plant.harvestDate },
          { label: "📍 Move",                                                    type: "move",       done: false },
        ]).map(b =>
          `<button class="quick-btn${b.done ? " done" : ""}" data-action="${b.type}" data-plant="${plant.id}">${b.label}</button>`
        ).join("");

        return `
          <div class="plant-card" data-open="${plant.id}" style="${
            na && na.emoji === "🔴" ? "background:#fff5f3;border-color:#e8856a;border-width:2px;" :
            na && na.emoji === "🟢" ? "background:#f0fff4;border-color:#86efac;border-width:2px;" :
            germOverdue             ? "background:#fffbf0;border-color:#e8c85a;border-width:2px;" : ""
          }">
            <div class="plant-card-main">
              <div class="location-icon" style="background:${color}22;">${LOCATION_ICONS[plant.location] || "🌱"}</div>
              <div style="flex:1;min-width:0;">
                <div class="plant-name">${esc(plant.name)}</div>
                <div class="plant-meta">${tags}</div>
                ${datesRow}
              </div>
              <div style="display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;align-self:stretch;padding-left:8px;">
                <button class="delete-plant-btn" data-del-plant="${plant.id}" title="Delete plant">×</button>
                <div class="chevron">›</div>
              </div>
            </div>
            <div class="quick-actions">${btns}</div>
          </div>`;
      };

      const cards = LOCATIONS
        .filter(loc => grouped[loc].length > 0)
        .map(loc => {
          const color     = LOCATION_COLORS[loc] || "#64748b";
          const icon      = LOCATION_ICONS[loc]  || "📍";
          const collapsed = state.collapsedLocations.has(loc);
          const count     = loc !== "raised bed" ? ` <span style="opacity:0.5;font-weight:400;">×${grouped[loc].length}</span>` : "";
          const chevron   = `<span class="location-group-chevron${collapsed ? " collapsed" : ""}">▾</span>`;
          const header    = `<button class="location-group-label" data-toggle-loc="${esc(loc)}" style="color:${color};"><span>${icon} ${loc}${count}</span>${chevron}</button>`;

          if (collapsed) return header;

          if (loc !== "raised bed") {
            return header + grouped[loc].map(renderCard).join("");
          }

          const beds = {};
          grouped[loc].forEach(plant => {
            const key = plant.bedNumber != null ? plant.bedNumber : "—";
            if (!beds[key]) beds[key] = [];
            beds[key].push(plant);
          });
          const bedKeys = Object.keys(beds).sort((a, b) => {
            if (a === "—") return 1;
            if (b === "—") return -1;
            return Number(a) - Number(b);
          });
          const bedSections = bedKeys.map(key =>
            `<div class="bed-group-label" style="color:${color};">Bed ${key} <span style="opacity:0.5;font-weight:400;">×${beds[key].length}</span></div>`
            + beds[key].map(renderCard).join("")
          ).join("");

          return header + bedSections;
        }).join("");

      const addSection = state.addingPlant ? `
        <div class="add-plant-form">
          <input id="new-plant-name" class="input-text" type="text" placeholder="Plant name (e.g. Borlotti Bean)" autofocus>
          <div class="btn-row">
            <button class="btn-primary" id="confirm-add">Add Plant</button>
            <button class="btn-secondary" id="cancel-add">Cancel</button>
          </div>
        </div>` : `
        <button class="add-plant-btn" id="start-add">+ Add another plant</button>`;

      return header + `
        <div class="summary-strip">
          ${chips}
          ${sownCount > 0       ? `<div class="summary-chip">🌱 ${sownCount}</div>` : ""}
          ${germinatedCount > 0 ? `<div class="summary-chip">🪴 ${germinatedCount}</div>` : ""}
        </div>
        <div class="page-section-label">Overview</div>
        ${renderScheduleOverview()}
        <div class="page-section-label">Plants</div>
        ${cards}
        ${addSection}`;
    }

    function renderSeedDetail() {
      const s = state.seeds.find(sd => sd.id === state.selectedSeedId);
      if (!s) return "";

      const expiry = getSeedExpiryStatus(s.expirationYear);

      const seedNotes = s.notes && s.notes.filter(e => e.type === "note").length > 0 ? `
        <div class="section-card">
          <div class="section-label">Notes</div>
          ${s.notes.filter(e => e.type === "note").map(ev => `
            <div class="event-row">
              <div class="event-date">${formatDate(ev.date)}</div>
              <div class="event-detail">${esc(ev.detail)}</div>
            </div>`).join("")}
        </div>` : "";

      return `
        <button class="back-btn" id="back-seeds">← All seeds</button>
        <div class="detail-title">${esc(s.name)}</div>
        <div class="detail-meta">
          <span class="tag" style="background:#fdf6e3;color:#92630a;">🌾 Seed</span>
          ${expiry ? `<span class="tag ${expiry.cls}">${esc(expiry.label)}</span>` : ""}
        </div>

        <div class="section-card">
          <div class="section-label">Details</div>
          <div class="date-row">
            <span class="date-label">Name</span>
            <input type="text" id="seed-name-input" value="${esc(s.name)}"
              style="width:180px;padding:4px 8px;border:1px solid #b5d0b5;border-radius:6px;font-size:12px;background:#f0f7f0;color:#2d4a2d;font-family:sans-serif;">
          </div>
          <div class="date-row">
            <span class="date-label">Seeds per packet</span>
            <div style="display:flex;align-items:center;gap:6px;">
              <input type="number" id="seed-qty-input" min="1" max="9999"
                value="${s.numberPerPacket || ""}" placeholder="—"
                style="width:64px;text-align:center;padding:4px 8px;border:1px solid #b5d0b5;border-radius:6px;font-size:12px;background:#f0f7f0;color:#2d4a2d;font-family:sans-serif;">
              <span style="font-size:12px;color:#888;font-family:sans-serif;">seeds</span>
            </div>
          </div>
          <div class="date-row" style="border-bottom:none;">
            <span class="date-label">Expiry year</span>
            <input type="number" id="seed-expiry-input" min="2000" max="2060"
              value="${s.expirationYear || ""}" placeholder="e.g. 2027"
              style="width:90px;text-align:center;padding:4px 8px;border:1px solid #b5d0b5;border-radius:6px;font-size:12px;background:#f0f7f0;color:#2d4a2d;font-family:sans-serif;">
          </div>
        </div>

        <div class="section-card">
          <div class="section-label">Key Facts</div>
          <div class="date-row">
            <span class="date-label">Sowing months</span>
            <input type="text" id="seed-sowing-input" value="${esc(s.sowingMonths || "")}" placeholder="e.g. Apr – Jun"
              style="width:140px;padding:4px 8px;border:1px solid #b5d0b5;border-radius:6px;font-size:12px;background:#f0f7f0;color:#2d4a2d;font-family:sans-serif;">
          </div>
          <div class="date-row">
            <span class="date-label">Harvest months</span>
            <input type="text" id="seed-harvest-input" value="${esc(s.harvestMonths || "")}" placeholder="e.g. Jul – Oct"
              style="width:140px;padding:4px 8px;border:1px solid #b5d0b5;border-radius:6px;font-size:12px;background:#f0f7f0;color:#2d4a2d;font-family:sans-serif;">
          </div>
          <div class="date-row" style="border-bottom:none;">
            <span class="date-label">Position</span>
            <select id="seed-position-select" class="location-select">
              <option value="">—</option>
              <option value="Full sun"      ${s.position === "Full sun"       ? "selected" : ""}>☀️ Full sun</option>
              <option value="Partial shade" ${s.position === "Partial shade"  ? "selected" : ""}>⛅ Partial shade</option>
              <option value="Full shade"    ${s.position === "Full shade"     ? "selected" : ""}>🌥️ Full shade</option>
            </select>
          </div>
        </div>

        <div class="section-card">
          <div class="section-label">Add a note</div>
          <div style="display:flex;gap:8px;align-items:flex-start;">
            <textarea class="note-textarea" id="seed-note-input" rows="3" style="flex:1;margin-bottom:0;"
              placeholder="e.g. Bought from local nursery, germination rate ~85%…">${esc(state.currentNote)}</textarea>

          Delete seed
        </button>
        <button id="back-seeds-bottom" class="add-plant-btn" style="margin-top:12px;">← All seeds</button>`;
