    function renderDetail() {
      const p = state.plants.find(pl => pl.id === state.selectedPlantId);
      if (!p) return "";

      const sowDays  = p.cropType === "transplanted" ? daysSince(p.transplantDate) : daysSince(p.sowDate);
      const color    = LOCATION_COLORS[p.location] || "#64748b";
      const estGerm    = estimatedGerminationDate(p);
      const estHarvest = estimatedHarvestDate(p);

      const locOptions = LOCATIONS.map(loc =>
        `<option value="${esc(loc)}"${p.location === loc ? " selected" : ""}>${LOCATION_ICONS[loc]} ${esc(loc)}</option>`
      ).join("");

      const numInput = (id, val, opts = {}) => `
        <input type="number" id="${id}" min="${opts.min ?? 1}" max="${opts.max ?? 9999}"
          value="${val || ""}" placeholder="—"
          style="width:${opts.width ?? "64px"};text-align:center;padding:4px 8px;border:1px solid #b5d0b5;border-radius:6px;font-size:12px;background:#f0f7f0;color:#2d4a2d;font-family:sans-serif;">`;

      const dateInput = (field, val) => `
        <input type="date" class="date-input" data-field="${field}" value="${val || ""}" max="${todayStr()}">`;

      const estGermDisplay = (() => {
        if (!estGerm) return `<span style="font-size:12px;font-family:sans-serif;color:#ccc;">set sow date &amp; period</span>`;
        const daysLeft = Math.ceil((new Date(estGerm) - new Date()) / 86400000);
        const col    = daysLeft < 0 ? "#8a9a8a" : daysLeft === 0 ? "#059669" : "#2d4a2d";
        const suffix = daysLeft < 0 ? ` (${Math.abs(daysLeft)}d ago)` : daysLeft === 0 ? " (today!)" : ` (in ${daysLeft}d)`;
        const formula = `<span style="font-size:11px;color:#aaa;font-family:sans-serif;margin-right:4px;">sow +${p.germinationDays}d →</span>`;
        return `${formula}<span style="font-size:12px;font-family:sans-serif;font-weight:600;color:${col};">${formatDate(estGerm)}${suffix}</span>`;
      })();

      const estHarvestDisplay = (() => {
        const needsDate = p.cropType === "transplanted" ? "transplant date &amp; days" : "sow date &amp; days";
        if (!estHarvest) return `<span style="font-size:12px;font-family:sans-serif;color:#ccc;">set ${needsDate}</span>`;
        const daysLeft = Math.ceil((new Date(estHarvest) - new Date()) / 86400000);
        const col    = daysLeft < 0 ? "#8a9a8a" : daysLeft === 0 ? "#b45309" : "#2d4a2d";
        const suffix = daysLeft < 0 ? ` (${Math.abs(daysLeft)}d ago)` : daysLeft === 0 ? " (today!)" : ` (in ${daysLeft}d)`;
        const basis  = p.cropType === "transplanted" ? "transplant" : "sow";
        const formula = `<span style="font-size:11px;color:#aaa;font-family:sans-serif;margin-right:4px;">${basis} +${p.harvestDays}d →</span>`;
        return `${formula}<span style="font-size:12px;font-family:sans-serif;font-weight:600;color:${col};">${formatDate(estHarvest)}${suffix}</span>`;
      })();

      const nextFeedDisplay = (() => {
        const fs = feedStatus(p);
        if (!fs) return "";
        const label = fs.daysUntil < 0  ? `${Math.abs(fs.daysUntil)}d overdue`
                    : fs.daysUntil === 0 ? "today"
                    : fs.daysUntil === 1 ? `tomorrow (${formatDate(fs.nextDate)})`
                    : `${formatDate(fs.nextDate)} — in ${fs.daysUntil}d`;
        const col = fs.daysUntil <= 0 ? "#cc4a20" : fs.daysUntil <= 2 ? "#b45309" : "#3a6a3a";
        return `<div class="date-row">
          <span class="date-label" style="color:#aaa;">Next feed</span>
          <span style="font-size:12px;font-family:sans-serif;font-weight:600;color:${col};">${label}</span>
        </div>`;
      })();

      const notes = p.events && p.events.length > 0 ? `
        <div class="section-card">
          <div class="section-label">Event Log</div>
          ${p.events.map(ev => `
            <div class="event-row">
              <div class="event-date">${formatDate(ev.date)}</div>
              <div style="flex:1;">
                ${ev.type !== "note" ? `<span class="event-type">${esc(ev.type)}</span>` : ""}
                ${ev.detail ? `<span class="event-detail">${esc(ev.detail)}</span>` : ""}
              </div>
            </div>`).join("")}
        </div>` : "";

      return `
        <button class="back-btn" id="back-home">← All plants</button>
        <div class="detail-title">${esc(p.name)}</div>
        <div class="detail-meta">
          <span class="tag tag-loc" style="background:${color}22;color:${color};">${LOCATION_ICONS[p.location]} ${esc(p.location)}</span>
          ${sowDays !== null ? `<span class="tag tag-day">Day ${sowDays}</span>` : ""}
        </div>

        <div class="section-card">
          <div class="section-label">General</div>
          <div class="date-row">
            <span class="date-label">Name</span>
            <input type="text" id="plant-name-input" value="${esc(p.name)}"
              style="width:160px;padding:4px 8px;border:1px solid #b5d0b5;border-radius:6px;font-size:12px;background:#f0f7f0;color:#2d4a2d;font-family:sans-serif;">
          </div>
          <div class="date-row">
            <span class="date-label">Growth method</span>
            <select id="crop-type-select" class="location-select">
              <option value="sown" ${(p.cropType || "sown") === "sown" ? "selected" : ""}>🌱 Direct sown</option>
              <option value="transplanted" ${p.cropType === "transplanted" ? "selected" : ""}>🪴 Transplanted</option>
            </select>
          </div>
          <div style="font-size:11px;color:#8a9a8a;font-family:sans-serif;padding:2px 0 6px;">
            ${p.cropType === "transplanted" ? "Harvest estimate uses transplant date" : "Harvest estimate uses sow date"}
          </div>
        </div>

        <div class="section-card">
          <div class="section-label">Sowing</div>
          <div class="date-row">
            <span class="date-label">Sow date</span>
            ${dateInput("sowDate", p.sowDate)}
          </div>
          <div class="date-row" style="border-bottom:none;">
            <span class="date-label">Quantity sown</span>
            <div style="display:flex;align-items:center;gap:6px;">
              ${numInput("quantity-input", p.quantity)}
              <span style="font-size:12px;color:#888;font-family:sans-serif;">plants</span>
            </div>
          </div>
        </div>

        <div class="section-card">
          <div class="section-label">Germination</div>
          <div class="date-row">
            <span class="date-label">Period</span>
            <div style="display:flex;align-items:center;gap:6px;">
              ${numInput("germ-days-input", p.germinationDays, { width: "56px", max: 365 })}
              <span style="font-size:12px;color:#888;font-family:sans-serif;">days</span>
            </div>
          </div>
          <div class="date-row">
            <span class="date-label">Temperature</span>
            <input type="text" id="germ-temp-input" value="${esc(p.germinationTemp || "")}" placeholder="e.g. 20–25°C"
              style="width:110px;padding:4px 8px;border:1px solid #b5d0b5;border-radius:6px;font-size:12px;background:#f0f7f0;color:#2d4a2d;font-family:sans-serif;">
          </div>
          <div class="date-row">
            <span class="date-label" style="color:#aaa;">Est. germination</span>
            ${estGermDisplay}
          </div>
          <div class="date-row">
            <span class="date-label">Germination date</span>
            ${dateInput("germinationDate", p.germinationDate)}
          </div>
          <div class="date-row" style="border-bottom:none;">
            <span class="date-label">Quantity germinated</span>
            <div style="display:flex;align-items:center;gap:6px;">
              ${numInput("germinated-qty-input", p.germinatedQuantity)}
              <span style="font-size:12px;color:#888;font-family:sans-serif;">plants</span>
            </div>
          </div>
        </div>

        ${p.cropType === "transplanted" ? `
        <div class="section-card">
          <div class="section-label">Transplanting</div>
          <div class="date-row" style="border-bottom:none;">
            <span class="date-label">Transplant date</span>
            ${dateInput("transplantDate", p.transplantDate)}
          </div>
        </div>` : ""}

        <div class="section-card">
          <div class="section-label">Harvest</div>
          <div class="date-row">
            <span class="date-label">Days to harvest</span>
            <div style="display:flex;align-items:center;gap:6px;">
              ${numInput("harvest-days-input", p.harvestDays, { width: "56px", max: 365 })}
              <span style="font-size:12px;color:#888;font-family:sans-serif;">days</span>
            </div>
          </div>
          <div class="date-row">
            <span class="date-label" style="color:#aaa;">Est. harvest</span>
            ${estHarvestDisplay}
          </div>
          <div class="date-row">
            <span class="date-label">Harvest date</span>
            ${dateInput("harvestDate", p.harvestDate)}
          </div>
          <div class="date-row" style="border-bottom:none;">
            <span class="date-label">Temperature</span>
            <input type="text" id="harvest-temp-input" value="${esc(p.harvestTemp || "")}" placeholder="e.g. 20–25°C"
              style="width:110px;padding:4px 8px;border:1px solid #b5d0b5;border-radius:6px;font-size:12px;background:#f0f7f0;color:#2d4a2d;font-family:sans-serif;">
          </div>
        </div>

        <div class="section-card">
          <div class="section-label">Care</div>
          <div class="date-row">
            <span class="date-label">Location</span>
            <select class="location-select" id="loc-select">${locOptions}</select>
          </div>
          ${p.location === "raised bed" ? `
          <div class="date-row">
            <span class="date-label">Bed</span>
            <input type="number" id="bed-number-input" value="${p.bedNumber != null ? p.bedNumber : ""}" min="1" step="1" placeholder="№"
              style="width:64px;padding:4px 8px;border:1px solid #b5d0b5;border-radius:6px;font-size:12px;background:#f0f7f0;color:#2d4a2d;font-family:sans-serif;text-align:center;">
          </div>` : ""}
          <div class="date-row">
            <span class="date-label">Potted on</span>
            ${dateInput("potOnDate", p.potOnDate)}
          </div>
          <div class="date-row">
            <span class="date-label">Last fed</span>
            ${dateInput("lastFed", p.lastFed)}
          </div>
          <div class="date-row">
            <span class="date-label">Feed every</span>
            <div style="display:flex;align-items:center;gap:6px;">
              ${numInput("feed-every-input", p.feedEvery, { width: "56px", max: 365 })}
              <span style="font-size:12px;color:#888;font-family:sans-serif;">days</span>
            </div>
          </div>
          ${nextFeedDisplay}
        </div>

        <div class="section-card">
          <div class="section-label">Add a note</div>
          <div style="display:flex;gap:8px;align-items:flex-start;">
            <textarea class="note-textarea" id="note-input" rows="3" style="flex:1;margin-bottom:0;"
              placeholder="e.g. Pinched out growing tip, spotted yellowing on lower leaves...">${esc(state.currentNote)}</textarea>
            <button class="save-note-btn" id="save-note" style="width:auto;padding:10px 14px;align-self:stretch;">Add</button>
          </div>
        </div>

        ${notes}
        <button id="back-home-bottom" class="add-plant-btn" style="margin-top:16px;">← All plants</button>`;
    }

    // ── Events ─────────────────────────────────────────────────────────────
    function attachEvents() {
      // ── Home view (plants or seeds tab) ──
      if (state.view === "home") {

        document.getElementById("toggle-storage")?.addEventListener("click", () => {
          state.storageOpen = !state.storageOpen;
          state.snapshotName = "";
          render();
        });

        document.getElementById("tab-plants")?.addEventListener("click", () => {
          state.activeTab = "plants";
          state.addingSeed = false;
          render();
        });

        document.getElementById("tab-seeds")?.addEventListener("click", () => {
          state.activeTab = "seeds";
          state.addingPlant = false;
          render();
        });

        // Storage panel events
        if (state.storageOpen) {
          document.getElementById("snap-name")?.addEventListener("input", e => {
            state.snapshotName = e.target.value;
          });

          document.getElementById("do-save-snap")?.addEventListener("click", () => {
            const name = document.getElementById("snap-name")?.value?.trim();
            if (!name) return;
            saveSnapshot(name);
            state.snapshotName = "";
            render();
          });

          document.getElementById("snap-name")?.addEventListener("keydown", e => {
            if (e.key === "Enter") document.getElementById("do-save-snap")?.click();
          });

          document.querySelectorAll("[data-load-snap]").forEach(btn => {
            btn.addEventListener("click", () => loadSnapshot(btn.dataset.loadSnap));
          });

          document.querySelectorAll("[data-del-snap]").forEach(btn => {
            btn.addEventListener("click", () => {
              deleteSnapshot(btn.dataset.delSnap);
            });
          });

          document.getElementById("import-text")?.addEventListener("input", e => {
            state.importText = e.target.value;
          });

          document.getElementById("do-import")?.addEventListener("click", () => {
            importFromText(document.getElementById("import-text")?.value || "");
          });

          document.getElementById("load-sample")?.addEventListener("click", () => {
            if (!confirm("Load sample data? This will replace all current plant data.")) return;
            fetch("sample-plants.json")
              .then(r => r.json())
              .then(data => {
                state.plants = data;
                saveState();
                render();
              })
              .catch(() => alert("Could not load sample-plants.json. Open the app via a local server (e.g. Live Server)."));
          });

          document.getElementById("do-reset")?.addEventListener("click", () => {
            if (!confirm("Reset to default? All plant and seed data will be cleared.")) return;
            localStorage.removeItem(STORAGE_KEY);
            state.plants = JSON.parse(JSON.stringify(INITIAL_PLANTS));
            state.seeds  = [];
            render();
          });
        }

        // ── Plants tab events ──
        if (state.activeTab === "plants") {
          document.querySelectorAll("[data-toggle-loc]").forEach(btn => {
            btn.addEventListener("click", () => {
              const loc = btn.dataset.toggleLoc;
              if (state.collapsedLocations.has(loc)) {
                state.collapsedLocations.delete(loc);
              } else {
                state.collapsedLocations.add(loc);
              }
              render();
            });
          });

          document.querySelectorAll(".delete-plant-btn").forEach(btn => {
            btn.addEventListener("click", e => {
              e.stopPropagation();
              deletePlant(parseInt(btn.dataset.delPlant));
            });
          });

          document.querySelectorAll(".ov-item").forEach(item => {
            item.addEventListener("click", () => {
              state.selectedPlantId = parseInt(item.dataset.open);
              state.currentNote = "";
              state.view = "detail";
              render();
            });
          });

          document.querySelectorAll(".plant-card").forEach(card => {
            card.addEventListener("click", e => {
              if (e.target.closest(".quick-actions")) return;
              state.selectedPlantId = parseInt(card.dataset.open);
              state.currentNote = "";
              state.view = "detail";
              render();
            });
          });

          document.querySelectorAll(".quick-btn").forEach(btn => {
            btn.addEventListener("click", e => {
              e.stopPropagation();
              const type    = btn.dataset.action;
              const plantId = parseInt(btn.dataset.plant);
              const today   = todayStr();

              if (type === "sow")        { updatePlant(plantId, { sowDate: today }); }
              if (type === "germ")       { updatePlant(plantId, { germinationDate: today }); }
              if (type === "transplant") { updatePlant(plantId, { transplantDate: today }); }
              if (type === "poton")      { updatePlant(plantId, { potOnDate: today }); }
              if (type === "fed")        { updatePlant(plantId, { lastFed: today }); }
              if (type === "harvest") { updatePlant(plantId, { harvestDate: today }); }
              if (type === "move")  {
                state.selectedPlantId = plantId;
                state.currentNote = "";
                state.view = "detail";
                render();
                setTimeout(() => document.getElementById("loc-select")?.focus(), 50);
                return;
              }
              render();
            });
          });

          document.getElementById("start-add")?.addEventListener("click", () => {
            state.addingPlant = true;
            render();
            document.getElementById("new-plant-name")?.focus();
          });

          document.getElementById("confirm-add")?.addEventListener("click", confirmAddPlant);

          document.getElementById("new-plant-name")?.addEventListener("keydown", e => {
            if (e.key === "Enter") confirmAddPlant();
          });

          document.getElementById("cancel-add")?.addEventListener("click", () => {
            state.addingPlant = false;
            render();
          });
        }

        // ── Seeds tab events ──
        if (state.activeTab === "seeds") {
          document.querySelectorAll("[data-open-seed]").forEach(card => {
            card.addEventListener("click", () => {
              state.selectedSeedId = parseInt(card.dataset.openSeed);
              state.currentNote = "";
              state.view = "seed-detail";
              render();
            });
          });

          document.getElementById("start-add-seed")?.addEventListener("click", () => {
            state.addingSeed = true;
            render();
            document.getElementById("new-seed-name")?.focus();
          });

          document.getElementById("confirm-add-seed")?.addEventListener("click", confirmAddSeed);

          document.getElementById("new-seed-name")?.addEventListener("keydown", e => {
            if (e.key === "Enter") confirmAddSeed();
          });

          document.getElementById("cancel-add-seed")?.addEventListener("click", () => {
            state.addingSeed = false;
            render();
          });

          document.getElementById("start-scan-seed")?.addEventListener("click", scanAndCreateSeed);
        }
      }

      // ── Plant detail view ──
      if (state.view === "detail") {
        ["back-home", "back-home-bottom"].forEach(id => {
          document.getElementById(id)?.addEventListener("click", () => {
            state.view = "home";
            render();
          });
        });

        document.querySelectorAll(".date-input").forEach(input => {
          input.addEventListener("change", () => {
            if (!input.value) return;
            const field = input.dataset.field;
            updatePlant(state.selectedPlantId, { [field]: input.value });
            state.currentNote = document.getElementById("note-input")?.value || "";
            render();
          });
        });

        document.getElementById("feed-every-input")?.addEventListener("change", e => {
          const val = parseInt(e.target.value);
          updatePlant(state.selectedPlantId, { feedEvery: val > 0 ? val : null });
          state.currentNote = document.getElementById("note-input")?.value || "";
          render();
        });

        document.getElementById("quantity-input")?.addEventListener("change", e => {
          const val = parseInt(e.target.value);
          updatePlant(state.selectedPlantId, { quantity: val > 0 ? val : null });
          state.currentNote = document.getElementById("note-input")?.value || "";
          render();
        });

        document.getElementById("germ-days-input")?.addEventListener("change", e => {
          const val = parseInt(e.target.value);
          updatePlant(state.selectedPlantId, { germinationDays: val > 0 ? val : null });
          state.currentNote = document.getElementById("note-input")?.value || "";
          render();
        });

        document.getElementById("germ-temp-input")?.addEventListener("change", e => {
          const val = e.target.value.trim();
          updatePlant(state.selectedPlantId, { germinationTemp: val || null });
          state.currentNote = document.getElementById("note-input")?.value || "";
          render();
        });

        document.getElementById("germinated-qty-input")?.addEventListener("change", e => {
          const val = parseInt(e.target.value);
          updatePlant(state.selectedPlantId, { germinatedQuantity: val > 0 ? val : null });
          state.currentNote = document.getElementById("note-input")?.value || "";
          render();
        });

        document.getElementById("harvest-days-input")?.addEventListener("change", e => {
          const val = parseInt(e.target.value);
          updatePlant(state.selectedPlantId, { harvestDays: val > 0 ? val : null });
          state.currentNote = document.getElementById("note-input")?.value || "";
          render();
        });

        document.getElementById("harvest-temp-input")?.addEventListener("change", e => {
          const val = e.target.value.trim();
          updatePlant(state.selectedPlantId, { harvestTemp: val || null });
          state.currentNote = document.getElementById("note-input")?.value || "";
          render();
        });

        document.getElementById("plant-name-input")?.addEventListener("change", e => {
          const val = e.target.value.trim();
          if (val) updatePlant(state.selectedPlantId, { name: val });
          state.currentNote = document.getElementById("note-input")?.value || "";
          render();
        });

        document.getElementById("crop-type-select")?.addEventListener("change", e => {
          updatePlant(state.selectedPlantId, { cropType: e.target.value });
          state.currentNote = document.getElementById("note-input")?.value || "";
          render();
        });

        document.getElementById("loc-select")?.addEventListener("change", e => {
          const update = { location: e.target.value };
          if (e.target.value !== "raised bed") update.bedNumber = null;
          updatePlant(state.selectedPlantId, update);
          state.currentNote = document.getElementById("note-input")?.value || "";
          render();
        });

        document.getElementById("bed-number-input")?.addEventListener("change", e => {
          const val = e.target.value === "" ? null : parseInt(e.target.value, 10);
          updatePlant(state.selectedPlantId, { bedNumber: isNaN(val) ? null : val });
          render();
        });

        document.getElementById("note-input")?.addEventListener("input", e => {
          state.currentNote = e.target.value;
        });

        document.getElementById("save-note")?.addEventListener("click", () => {
          const note = document.getElementById("note-input")?.value?.trim();
          if (!note) return;
          logEvent(state.selectedPlantId, "note", note);
          state.currentNote = "";
          render();
        });
      }

      // ── Seed detail view ──
      if (state.view === "seed-detail") {
        ["back-seeds", "back-seeds-bottom"].forEach(id => {
          document.getElementById(id)?.addEventListener("click", () => {
            state.view = "home";
            state.activeTab = "seeds";
            render();
          });
        });

        document.getElementById("seed-name-input")?.addEventListener("change", e => {
          const val = e.target.value.trim();
          if (val) updateSeed(state.selectedSeedId, { name: val });
          state.currentNote = document.getElementById("seed-note-input")?.value || "";
          render();
        });

        document.getElementById("seed-qty-input")?.addEventListener("change", e => {
          const val = parseInt(e.target.value);
          updateSeed(state.selectedSeedId, { numberPerPacket: val > 0 ? val : null });
          state.currentNote = document.getElementById("seed-note-input")?.value || "";
          render();
        });

        document.getElementById("seed-expiry-input")?.addEventListener("change", e => {
          const val = parseInt(e.target.value);
          updateSeed(state.selectedSeedId, { expirationYear: val > 0 ? val : null });
          state.currentNote = document.getElementById("seed-note-input")?.value || "";
          render();
        });

        document.getElementById("seed-sowing-input")?.addEventListener("change", e => {
          updateSeed(state.selectedSeedId, { sowingMonths: e.target.value.trim() || "" });
          state.currentNote = document.getElementById("seed-note-input")?.value || "";
          render();
        });

        document.getElementById("seed-harvest-input")?.addEventListener("change", e => {
          updateSeed(state.selectedSeedId, { harvestMonths: e.target.value.trim() || "" });
          state.currentNote = document.getElementById("seed-note-input")?.value || "";
          render();
        });

        document.getElementById("seed-position-select")?.addEventListener("change", e => {
          updateSeed(state.selectedSeedId, { position: e.target.value || "" });
          state.currentNote = document.getElementById("seed-note-input")?.value || "";
          render();
        });

        document.getElementById("seed-note-input")?.addEventListener("input", e => {
          state.currentNote = e.target.value;
        });

        document.getElementById("save-seed-note")?.addEventListener("click", () => {
          const note = document.getElementById("seed-note-input")?.value?.trim();
          if (!note) return;
          logSeedNote(state.selectedSeedId, note);
          state.currentNote = "";
          render();
        });

        document.getElementById("delete-seed-btn")?.addEventListener("click", () => {
          deleteSeed(state.selectedSeedId);
        });
      }
    }

    function confirmAddPlant() {
      const name = document.getElementById("new-plant-name")?.value?.trim();
      if (!name) return;
      state.plants.push({
        id: Date.now(), name, variety: "", cropType: "sown",
        sowDate: null, potOnDate: null, lastFed: null, feedEvery: null,
        location: "indoor (grow light)", events: [],
        quantity: null, germinationDays: null, germinationTemp: null,
        germinationDate: null, germinatedQuantity: null,
        transplantDate: null, bedNumber: null,
        harvestDays: null, harvestDate: null, harvestTemp: null,
      });
      saveState();
      state.addingPlant = false;
      render();
    }

    function confirmAddSeed() {
      const name = document.getElementById("new-seed-name")?.value?.trim();
      if (!name) return;
      state.seeds.push({
        id: Date.now(), name,
        numberPerPacket: null,
        sowingMonths:   "",
        harvestMonths:  "",
        position:       "",
        expirationYear: null,
        notes: [],
      });
      saveState();
      state.addingSeed = false;
      render();
    }

    async function scanAndCreateSeed() {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = "image/*";

      input.onchange = async () => {
        const file = input.files[0];
        if (!file) return;

        let apiKey;
        try {
          apiKey = await getOaiKey();
        } catch (err) {
          alert(err.message);
          return;
        }

        const btn = document.getElementById("start-scan-seed");
        if (btn) { btn.textContent = "⏳ Scanning…"; btn.disabled = true; }

        try {
          const base64 = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload  = () => resolve(reader.result.split(",")[1]);
            reader.onerror = reject;
            reader.readAsDataURL(file);
          });

          const res = await fetch(
            `${AZURE_OAI_ENDPOINT}openai/deployments/${AZURE_OAI_DEPLOYMENT}/chat/completions?api-version=${AZURE_OAI_API_VER}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json", "api-key": apiKey },
              body: JSON.stringify({
                messages: [
                  {
                    role: "system",
                    content: "You are a seed packet data extractor. Read ALL visible text in the image carefully, including small print, embossed text, and any stamped or printed dates on foil or packaging edges. Return only valid JSON, no markdown, no explanation.",
                  },
                  {
                    role: "user",
                    content: [
                      {
                        type: "text",
                        text: `Extract the following from this seed packet image and return ONLY a JSON object with exactly these keys:

{
  "name": "plant name and variety as printed (exclude the brand/supplier name), e.g. French Bean 1500 Year Old Cave Bean",
  "sowingMonths": "sowing period as printed, e.g. April – June (use en-dash –, or empty string if not found)",
  "harvestMonths": "harvest period as printed, e.g. July – October (use en-dash –, or empty string if not found)",
  "position": "normalise to exactly one of: Full sun | Partial shade | Full shade — or empty string if not found",
  "numberPerPacket": 30,
  "expirationYear": 2025
}

Field guidance:
- name: use the plant species + variety only; ignore brand/supplier name (e.g. "She Grows Veg")
- numberPerPacket: look for "Average content", "Contents", "Seeds per pack", or any number followed by "seeds" or "Seeds"; return as integer or null
- expirationYear: look for "Best Before", "BB", "Use by", or any date stamped/embossed on the packet (including foil edges); return only the 4-digit year as integer, or null if genuinely absent`,
                      },
                      {
                        type: "image_url",
                        image_url: { url: `data:${file.type || "image/jpeg"};base64,${base64}`, detail: "high" },
                      },
                    ],
                  },
                ],
                max_tokens: 400,
              }),
            }
          );

          if (!res.ok) throw new Error(`API error ${res.status}`);

          const data  = await res.json();
          const text  = data.choices?.[0]?.message?.content?.trim() ?? "";
          const clean = text.replace(/^```json?\s*/i, "").replace(/\s*```$/i, "").trim();
          const ex    = JSON.parse(clean);

          const validPos = ["Full sun", "Partial shade", "Full shade"];
          const seed = {
            id:              Date.now(),
            name:            ex.name             || "Unknown",
            sowingMonths:    ex.sowingMonths      || "",
            harvestMonths:   ex.harvestMonths     || "",
            position:        validPos.includes(ex.position) ? ex.position : "",
            numberPerPacket: ex.numberPerPacket != null ? parseInt(ex.numberPerPacket) || null : null,
            expirationYear:  ex.expirationYear  != null ? parseInt(ex.expirationYear)  || null : null,
            notes: [],
          };

          state.seeds.push(seed);
          saveState();
          state.addingSeed    = false;
          state.selectedSeedId = seed.id;
          state.view          = "seed-detail";
          render();
        } catch (err) {
          alert(`Could not extract from image: ${err.message}`);
          const b = document.getElementById("start-scan-seed");
          if (b) { b.textContent = "📷 Scan packet to add"; b.disabled = false; }
        }
      };

      input.click();
    }

    // ── Boot ───────────────────────────────────────────────────────────────
    render();
  </script>
</body>
